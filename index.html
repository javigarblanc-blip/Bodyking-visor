<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bodyking FC — Visor</title>
<meta name="theme-color" content="#0d0f0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0d0f0f; --ink2:#17191a; --ink3:#202425; --linea:rgba(255,255,255,.07);
    --turq:#00d9c4; --turq-osc:#00332c; --tiza:#f4f6f5; --texto:#dfe5e3; --gris:#8b9490; --gris2:#5f6865;
    --verde:#43d17a; --rojo:#ff5a5f; --ambar:#ffb020;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--ink); color:var(--texto);
    min-height:100vh; padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px)); }
  .app { max-width:480px; margin:0 auto; }
  .osw { font-family:'Oswald',sans-serif; }
  button { font-family:inherit; cursor:pointer; }

  /* Cabecera */
  .cab { background:var(--ink2); border:3px solid var(--turq); border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .cab img { width:52px; height:52px; border-radius:10px; object-fit:contain; background:#fff; flex-shrink:0; }
  .cab-t { font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; color:var(--tiza); letter-spacing:.5px; text-transform:uppercase; line-height:1.1; }
  .cab-s { font-size:11px; color:var(--gris); margin-top:3px; }
  .cab-tag { margin-left:auto; align-self:flex-start; font-size:9.5px; font-weight:700; color:var(--gris); background:rgba(255,255,255,.05); padding:3px 7px; border-radius:6px; white-space:nowrap; }

  /* Tarjetas */
  .card { background:var(--ink2); border:1px solid var(--linea); border-radius:14px; padding:13px; margin-bottom:10px; }
  .card-t { font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--gris); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .nota { font-size:10.5px; color:var(--gris2); line-height:1.45; margin-top:8px; }
  .vacio { text-align:center; padding:26px 12px; color:var(--gris); font-size:12.5px; line-height:1.55; }
  .vacio .ic { font-size:28px; display:block; margin-bottom:8px; }

  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .box { background:var(--ink3); border-radius:10px; padding:9px 4px; text-align:center; }
  .box .v { font-family:'Oswald',sans-serif; font-weight:700; font-size:21px; color:var(--tiza); line-height:1.1; }
  .box .l { font-size:9.5px; color:var(--gris); font-weight:700; text-transform:uppercase; letter-spacing:.3px; margin-top:3px; }

  .bola { width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:var(--ink); }
  .bola.V { background:var(--verde); } .bola.E { background:#9aa3a0; } .bola.D { background:var(--rojo); color:#fff; }

  .chip-res { font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; padding:4px 10px; border-radius:8px; white-space:nowrap; }
  .chip-res.V { background:rgba(67,209,122,.14); color:var(--verde); }
  .chip-res.E { background:rgba(255,255,255,.07); color:#c3cbc8; }
  .chip-res.D { background:rgba(255,90,95,.14); color:var(--rojo); }

  /* Filas */
  .fila { display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid var(--linea); }
  .fila:first-child { border-top:none; }
  .fila.toque { cursor:pointer; }
  .fila.toque:active { background:rgba(255,255,255,.03); }
  .dorsal { width:28px; height:28px; border-radius:50%; flex-shrink:0; background:var(--turq-osc); border:1.5px solid var(--turq); color:var(--turq); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; }
  .nom { flex:1; min-width:0; font-weight:700; font-size:13.5px; color:var(--tiza); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:11px; color:var(--gris); font-weight:500; margin-top:2px; white-space:normal; }
  .val { font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; color:var(--turq); white-space:nowrap; text-align:right; }
  .pos { width:18px; font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--gris2); text-align:center; flex-shrink:0; }
  .flecha { color:var(--gris2); font-size:16px; flex-shrink:0; }

  .partido { cursor:pointer; }
  .partido .rv { font-weight:700; font-size:14px; color:var(--tiza); }
  .partido .mt { font-size:11px; color:var(--gris); margin-top:3px; line-height:1.4; }

  /* Controles */
  .segs { display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
  .seg { flex:1; min-width:0; padding:8px 6px; border-radius:9px; border:1px solid var(--linea); background:var(--ink3); color:var(--gris); font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:.3px; white-space:nowrap; }
  .seg.on { background:var(--turq); color:var(--turq-osc); border-color:var(--turq); }
  select.sel { width:100%; padding:10px; border-radius:10px; background:var(--ink3); color:var(--tiza); border:1px solid var(--linea); font-size:13px; font-family:inherit; margin-bottom:10px; }

  .barra { height:6px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; }
  .barra i { display:block; height:100%; border-radius:3px; background:var(--turq); }

  /* Tabla ficha */
  .tabla-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; }
  table.tb { width:100%; min-width:340px; border-collapse:collapse; font-size:12.5px; }
  .tb th { font-size:10.5px; color:var(--gris); font-weight:700; padding:7px 3px; text-align:center; white-space:nowrap; cursor:pointer; user-select:none; }
  .tb th.on { color:var(--turq); }
  .tb th:first-child, .tb td:first-child { text-align:left; padding-left:6px; }
  .tb td { padding:9px 3px; text-align:center; border-top:1px solid var(--linea); font-weight:600; }
  .tb td.n { font-weight:700; color:var(--tiza); white-space:nowrap; max-width:96px; overflow:hidden; text-overflow:ellipsis; }
  .tb tr.mvp td { background:rgba(0,217,196,.09); }
  .tb tr.mvp td:first-child { box-shadow:inset 3px 0 0 var(--turq); }
  .tb tr.tot td { color:var(--gris); font-weight:800; border-top:2px solid var(--linea); }
  .tb tbody tr.j { cursor:pointer; }
  .pos-v { color:var(--verde); } .neg-v { color:var(--rojo); } .cero-v { color:var(--gris2); }

  .golmin { display:flex; flex-wrap:wrap; gap:6px; }
  .golmin span { font-family:'Oswald',sans-serif; font-weight:600; font-size:12.5px; padding:4px 10px; border-radius:14px; }
  .golmin .F { background:rgba(67,209,122,.15); color:var(--verde); }
  .golmin .C { background:rgba(255,90,95,.14); color:var(--rojo); }

  details.ia summary { font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:.4px; color:#b388ff; cursor:pointer; list-style:none; }
  details.ia summary::-webkit-details-marker { display:none; }
  details.ia .txt { white-space:pre-wrap; font-size:12.5px; line-height:1.6; color:var(--texto); margin-top:10px; }

  /* Modales */
  .modal { position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.78); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:14px 10px 30px; display:none; }
  .modal.abierto { display:block; }
  .modal-c { max-width:480px; margin:0 auto; background:var(--ink2); border-radius:18px; overflow:hidden; border-top:4px solid var(--turq); }
  .modal-h { display:flex; align-items:center; gap:10px; padding:14px; background:var(--ink); }
  .modal-h .t { flex:1; min-width:0; }
  .modal-h .t1 { font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; color:var(--tiza); line-height:1.15; }
  .modal-h .t2 { font-size:11.5px; color:var(--gris); margin-top:3px; line-height:1.4; }
  .cerrar { width:38px; height:38px; flex-shrink:0; border-radius:10px; border:1px solid var(--linea); background:rgba(255,255,255,.05); color:var(--tiza); font-size:17px; }
  .modal-b { padding:12px; }
  .modal-b .card { background:var(--ink3); }
  .modal-b .box { background:var(--ink); }

  /* Barra inferior */
  .tabbar-wrap { position:fixed; left:0; right:0; bottom:0; z-index:500; display:flex; justify-content:center; pointer-events:none; }
  .tabbar { width:100%; max-width:480px; display:flex; pointer-events:auto; background:rgba(23,25,26,.97); border-top:1px solid rgba(255,255,255,.08);
    border-radius:16px 16px 0 0; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px; border-radius:10px; border:none; background:none; color:var(--gris2);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:.4px; text-transform:uppercase; }
  .tab .ic { font-size:19px; }
  .tab.on { color:var(--turq); background:rgba(0,217,196,.08); }
  .panel { display:none; } .panel.on { display:block; }

  /* Directo */
  .tab.vivo { color:#ff6b6b; }
  .tab.vivo.on { color:#ff6b6b; background:rgba(255,90,95,.1); }
  .punto { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff5a5f; animation:lat 1.4s ease-in-out infinite; vertical-align:middle; }
  @keyframes lat { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .punto { animation:none; } }
  .banda-vivo { display:flex; align-items:center; gap:10px; background:rgba(255,90,95,.1); border:1px solid rgba(255,90,95,.35); border-radius:14px; padding:11px 13px; margin-bottom:10px; cursor:pointer; }
  .banda-vivo .t { flex:1; min-width:0; font-weight:700; font-size:13px; color:var(--tiza); }
  .banda-vivo .m { font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; color:var(--tiza); white-space:nowrap; }
  .marcador { background:var(--ink); border:1px solid var(--linea); border-radius:16px; padding:16px 12px 14px; margin-bottom:10px; text-align:center; }
  .marc-est { font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:1px; color:#ff6b6b; margin-bottom:10px; }
  .marc-est.gris { color:var(--gris); }
  .marc-fila { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
  .marc-eq { font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.4px; color:var(--gris); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .marc-eq.bk { color:var(--turq); }
  .marc-g { font-family:'Oswald',sans-serif; font-weight:700; font-size:46px; color:#fff; line-height:1; white-space:nowrap; }
  .marc-reloj { font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; color:#ffeb3b; margin-top:8px; letter-spacing:1px; }
  .campo { position:relative; width:100%; aspect-ratio:3/4; border-radius:14px; overflow:hidden; background:repeating-linear-gradient(0deg,#16432a 0 40px,#1a4d31 40px 80px); border:1px solid rgba(255,255,255,.1); }
  .campo .lin { position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(255,255,255,.3); }
  .campo .circ { position:absolute; left:50%; top:50%; width:64px; height:64px; border:1px solid rgba(255,255,255,.3); border-radius:50%; transform:translate(-50%,-50%); }
  .campo .area { position:absolute; left:30%; width:40%; height:10%; border:1px solid rgba(255,255,255,.3); }
  .jf { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; width:78px; }
  .jf .c { width:34px; height:34px; border-radius:50%; background:var(--turq); color:var(--turq-osc); border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; }
  .jf.gk .c { background:#29b6f6; color:#062536; }
  .jf .n { font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); padding:1px 6px; border-radius:5px; max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .jf .x { font-size:10px; line-height:1; }
  .ev { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--linea); font-size:13px; line-height:1.4; }
  .ev:first-child { border-top:none; }
  .ev b { font-family:'Oswald',sans-serif; font-weight:600; color:var(--turq); width:30px; flex-shrink:0; }
  .ev.rival b, .ev.rival { color:var(--gris); }
  #golAviso { display:none; position:fixed; left:12px; right:12px; top:calc(10px + env(safe-area-inset-top,0px)); max-width:456px; margin:0 auto; z-index:1200; text-align:center;
    padding:14px 16px; border-radius:16px; background:var(--turq); color:var(--turq-osc); box-shadow:0 14px 40px -8px rgba(0,217,196,.5); cursor:pointer; }
  #golAviso.on { display:block; animation:entra .35s ease-out; }
  #golAviso .a { font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; letter-spacing:.5px; }
  #golAviso .b { font-weight:700; font-size:13px; margin-top:3px; }
  @keyframes entra { from { transform:translateY(-130%); opacity:0; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { #golAviso.on { animation:none; } }

  .leyenda { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--gris); margin-top:6px; }
  .leyenda i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .tab { font-size:10.5px; letter-spacing:.2px; }
  .tab .ic { font-size:18px; }

  .pie { text-align:center; font-size:10px; color:var(--gris2); margin:16px 0 4px; line-height:1.5; }
  .pie a { color:inherit; }
  .aviso { background:rgba(255,176,32,.08); border:1px solid rgba(255,176,32,.3); color:var(--ambar); border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.5; margin-bottom:10px; }
</style>
</head>

<script>
/* =================================================================
   CONFIGURACIÓN — pega aquí la URL de tu Realtime Database de Firebase
   (la misma que pones en la app: Ajustes → Visor online).
   También vale abrir el visor con ?db=https://...firebasedatabase.app
   ================================================================= */
const DB_URL = 'https://bodyking-visor-default-rtdb.europe-west1.firebasedatabase.app';
const RUTA = 'bodyking/temporada';

const DUR_DEF = 50;           // duración por defecto de un partido (min)
const MIN_MUESTRA = 20;       // por debajo, la media se marca como poco fiable
const NIVELES = {
  'muy-superior': 'Rival muy superior', 'superior': 'Rival superior', 'similar': 'Rival parecido',
  'inferior': 'Rival asequible', 'muy-inferior': 'Rival muy asequible'
};

let D = null;          // datos de la temporada
let META = null;       // { actualizado }
let estado = { tab: 'resumen', rCrit: 'media', rRango: 'todos', rVista: 'jug', pVista: 'gen', evMet: 'impacto', jug: null, ficha: null };

/* ---------- utilidades ---------- */
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = (v, d = 0) => { const n = Number(v) || 0; return d ? n.toFixed(d).replace('.', ',') : String(Math.round(n * 10) / 10).replace('.', ','); };
const signo = (v, d = 0) => { const n = Number(v) || 0; return (n > 0 ? '+' : '') + num(n, d); };
const colV = v => v > 0 ? 'pos-v' : v < 0 ? 'neg-v' : 'cero-v';
const res = p => p.golesH > p.golesR ? 'V' : p.golesH < p.golesR ? 'D' : 'E';
const liga = () => (D.partidos || []).filter(p => p.tipo !== 'amistoso');
const pm = j => (j.golesFavorPista || 0) - (j.golesContraPista || 0);
const dorsalDe = nombre => { const j = (D.plantilla || []).find(x => x.nombre === nombre); if (j && j.dorsal != null) return j.dorsal;
  for (let i = (D.partidos || []).length - 1; i >= 0; i--) { const x = (D.partidos[i].jugadores || []).find(y => y.nombre === nombre); if (x && x.dorsal != null) return x.dorsal; } return null; };
const circulo = nombre => { const d = dorsalDe(nombre); return `<span class="dorsal">${d != null ? esc(d) : esc(String(nombre || '?').charAt(0))}</span>`; };
const mvpDe = p => (p.jugadores || []).slice().sort((a, b) => (b.impacto || 0) - (a.impacto || 0) || (b.goles || 0) - (a.goles || 0) || (b.asistencias || 0) - (a.asistencias || 0))[0] || null;
const informeDe = p => (D.informes || []).find(i => i.fecha === p.fecha && i.rival === p.rival) || null;
const nombrePos = id => (D.posiciones && D.posiciones[id]) || ['Portero','Lateral izq.','Lateral der.','Extremo izq.','Mediocentro','Extremo der.','Delantero'][id] || ('Pos ' + id);
const idxPartido = p => D.partidos.indexOf(p);
const plural = (n, s, pl) => `${n} ${n === 1 ? s : pl}`;

/* ---------- cálculos (mismo criterio que la app) ---------- */
function listaTemporada(rango) {
  if (rango === 'todos') {
    return Object.entries(D.historico || {}).map(([nombre, d]) => {
      const min = d.minutosTotales || 0, imp = d.impactoTotalAcumulado || 0, pj = d.partidosJugados || 0;
      const dur = pj > 0 ? ((d.minutosDuracionAcumulados || pj * DUR_DEF) / pj) : DUR_DEF;
      return { nombre, pj, min, goles: d.goles || 0, asist: d.asistencias || 0, perdidas: d.perdidas || 0, recuperaciones: d.recuperaciones || 0,
        tiros: d.tiros || 0, imp, media: min > 0 ? imp / min * dur : 0, pm: (d.golesFavorEnPista || 0) - (d.golesContraEnPista || 0),
        am: d.tarjetasAm || 0, ro: d.tarjetasRo || 0 };
    });
  }
  const ps = liga().slice(-parseInt(rango, 10)), acc = {};
  ps.forEach(p => (p.jugadores || []).forEach(j => {
    const a = acc[j.nombre] || (acc[j.nombre] = { pj:0, min:0, goles:0, asist:0, perdidas:0, recuperaciones:0, tiros:0, imp:0, dur:0, pm:0, am:0, ro:0 });
    a.min += j.minutos || 0; a.goles += j.goles || 0; a.asist += j.asistencias || 0; a.perdidas += j.perdidas || 0;
    a.recuperaciones += j.recuperaciones || 0; a.tiros += j.tiros || 0; a.imp += j.impacto || 0; a.pm += pm(j);
    if ((j.minutos || 0) > 0) { a.pj++; a.dur += (p.duracion || DUR_DEF); }
  }));
  return Object.entries(acc).map(([nombre, a]) => ({ nombre, ...a, media: a.min > 0 ? a.imp / a.min * (a.pj ? a.dur / a.pj : DUR_DEF) : 0 }));
}

function rankingBloque(partidos) {
  const ag = {};
  partidos.forEach(p => (p.jugadores || []).forEach(j => {
    const a = ag[j.nombre] || (ag[j.nombre] = { min:0, imp:0, goles:0, asist:0, rec:0, per:0, dur:0, pj:0 });
    a.min += j.minutos || 0; a.imp += j.impacto || 0; a.goles += j.goles || 0; a.asist += j.asistencias || 0;
    a.rec += j.recuperaciones || 0; a.per += j.perdidas || 0; a.dur += (p.duracion || DUR_DEF); a.pj++;
  }));
  return Object.entries(ag).map(([nombre, a]) => ({ nombre, ...a, media: a.min > 0 ? a.imp / a.min * (a.dur / a.pj) : 0 }))
    .filter(x => x.min > 0).sort((a, b) => b.media - a.media || b.imp - a.imp);
}

function formaJugador(nombre) {
  const v = liga().map(p => (p.jugadores || []).find(j => j.nombre === nombre)).filter(Boolean).slice(-4).map(j => j.impacto || 0);
  if (v.length < 2) return null;
  const m = Math.ceil(v.length / 2), a = v.slice(0, m), b = v.slice(m).length ? v.slice(m) : a;
  const dif = b.reduce((s, x) => s + x, 0) / b.length - a.reduce((s, x) => s + x, 0) / a.length;
  if (Math.abs(dif) < 0.4) return { ic: '➖', t: 'Forma estable', c: 'var(--gris)' };
  return dif > 0 ? { ic: '📈', t: 'En alza', c: 'var(--verde)' } : { ic: '📉', t: 'En baja', c: 'var(--rojo)' };
}

    const nombreC = { minutos:'Minutos', goles:'Goles', asistencias:'Asistencias', recuperaciones:'Recuperaciones', perdidas:'Pérdidas', tiros:'Tiros', pm:'+/-', impacto:'Impacto' }[c.k];

  }).join('');
  const tp = j.tiemposPorPosicion || {}, totS = Object.values(tp).reduce((s, v) => s + (v || 0), 0);

      </div>

const CRITERIOS = {
  media:  { t: '📊 Impacto medio por partido', v: x => x.media, f: x => signo(x.media, 2) },
  imp:    { t: '⭐ Impacto total', v: x => x.imp, f: x => signo(x.imp, 1) },

  pm:     { t: '➕ +/- con él en el campo', v: x => x.pm, f: x => signo(x.pm) },
  tiros:  { t: '🎯 Tiros', v: x => x.tiros, f: x => x.tiros },
  min:    { t: '⏱ Minutos', v: x => x.min, f: x => x.min + "'" },
  pj:     { t: '📋 Partidos jugados', v: x => x.pj, f: x => x.pj }
};
const COLOR_POS = ['#29b6f6', '#43a047', '#43a047', '#e53935', '#fdd835', '#e53935', '#8e5cd9'];
const colorPos = id => COLOR_POS[id] || '#8b9490';
const bloqueObs = (titulo, sub, filas) => `<div style="margin-top:12px; padding:10px 12px; border:1px dashed rgba(255,255,255,.15); border-radius:12px;">

function htmlRankingJugadores() {
  const lista = listaTemporada(estado.rRango).filter(x => x.pj > 0 || x.min > 0);
  if (!lista.length) return `<div class="card vacio"><span class="ic">📊</span>Aún no hay datos de jugadores.</div>`;
  const c = CRITERIOS[estado.rCrit] || CRITERIOS.media;
  const esMedia = estado.rCrit === 'media';
  const ok = esMedia ? lista.filter(x => x.min >= MIN_MUESTRA) : lista.slice();
  const obs = esMedia ? lista.filter(x => x.min < MIN_MUESTRA).sort((a, b) => b.min - a.min) : [];
  ok.sort((a, b) => c.v(b) - c.v(a) || b.min - a.min);
  const max = Math.max(...ok.map(x => Math.abs(c.v(x))), 0.01);
  const nLiga = liga().length;
  const rangos = [['todos', 'Temporada'], ['10', 'Últ. 10'], ['5', 'Últ. 5'], ['3', 'Últ. 3']].filter(([k]) => k === 'todos' || +k < nLiga || k === '3');
  const formaIc = n => { const f = estado.rRango === 'todos' ? formaJugador(n) : null; return f ? ` <span title="${f.t}" style="color:${f.c}; font-size:13px;">${f.ic}</span>` : ''; };

  // Reparto de minutos
  const porMin = lista.slice().sort((a, b) => b.min - a.min);
  const maxMin = Math.max(...porMin.map(x => x.min), 1);
  const mediaIdeal = Math.round(porMin.reduce((s, x) => s + x.min, 0) / porMin.length);
  const pMed = mediaIdeal / maxMin * 100;

  // Goleadores y asistentes + eficiencia
  const ga = lista.filter(x => x.goles || x.asist).sort((a, b) => (b.goles + b.asist) - (a.goles + a.asist) || b.goles - a.goles);
  const psRango = estado.rRango === 'todos' ? liga() : liga().slice(-parseInt(estado.rRango, 10));
  const minEq = psRango.reduce((s, p) => s + (p.duracion || DUR_DEF), 0), golEq = psRango.reduce((s, p) => s + (p.golesH || 0), 0);
  const efic = lista.filter(x => x.goles > 0).map(x => ({ ...x, mpg: Math.round(x.min / x.goles) })).sort((a, b) => a.mpg - b.mpg);

  // Posición de mayor impacto (temporada)
  const posImp = Object.entries(D.historico || {}).map(([nombre, d]) => {
    const ipp = d.impactoPorPosicion || {}, tot = Object.values(ipp).reduce((s, v) => s + Math.abs(v), 0);
    if (!tot) return null;
    let mejor = null, mv = -1; Object.entries(ipp).forEach(([k, v]) => { if (Math.abs(v) > mv) { mv = Math.abs(v); mejor = +k; } });
    return { nombre, id: mejor, val: ipp[mejor] || 0, pct: Math.round(mv / tot * 100) };
  }).filter(Boolean).sort((a, b) => b.pct - a.pct);

  const porteros = Object.entries(D.historico || {}).filter(([, d]) => (d.minutosPorteria || 0) > 0).map(([nombre, d]) => {
    const pj = d.partidosPorteria || 1, dur = (d.duracionPorteriaAcumulada || pj * DUR_DEF) / pj;
    const enc = d.golesEncajadosPorteria || 0, par = d.paradasPorteria || 0;
    return { nombre, min: d.minutosPorteria, pj: d.partidosPorteria || 0, enc, par, prom: enc * dur / d.minutosPorteria, pct: par + enc > 0 ? Math.round(par / (par + enc) * 100) : null };
  }).sort((a, b) => a.prom - b.prom);

  return `

      <div class="nota">${esMedia ? 'Impacto medio = impacto por minuto llevado a la duración de un partido, para comparar igual al que juega mucho y al que juega poco. ' : ''}${estado.rRango === 'todos' ? '📈📉 forma en los últimos partidos. ' : ''}Toca un jugador para ver su ficha.</div>
    </div>

        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--tiza);">${esc(x.nombre)}</b>
          <span style="color:var(--gris);"><b style="color:var(--tiza);">${x.min}'</b> <span class="${d >= 0 ? 'pos-v' : 'neg-v'}">(${signo(d)})</span></span></div>
        <div style="position:relative; height:8px; border-radius:4px; background:rgba(255,255,255,.06);">

/* Parejas: suma las parejas que guarda cada partido (desde que la app las graba) */
function parejasTemporada(def) {
  const acc = {};
  liga().forEach(p => (p.parejas || []).forEach(x => {
    const seg = def ? x.segDef : x.seg, imp = def ? x.impDef : x.imp;
    if (!seg) return;
    const [a, b] = [x.a, x.b].sort(), k = a + '\u0001' + b;
    const s = acc[k] || (acc[k] = { a, b, seg: 0, imp: 0, pj: 0, dur: 0 });
    s.seg += seg; s.imp += imp; s.pj++; s.dur += (p.duracion || DUR_DEF);
  }));
  return Object.values(acc).map(s => ({ ...s, min: Math.floor(s.seg / 60), media: s.seg > 0 ? s.imp / (s.seg / 60) * (s.dur / s.pj) : 0 }));
}
function htmlParejas() {
  const def = estado.pVista === 'def';
  const conDatos = liga().filter(p => Array.isArray(p.parejas) && p.parejas.length).length;
  const sub = `<div class="segs">${[['gen', '🤝 En el campo'], ['def', '🛡️ En defensa']].map(([k, t]) => `<button class="seg${estado.pVista === k ? ' on' : ''}" data-pvista="${k}">${t}</button>`).join('')}</div>`;
  if (!conDatos) return `<div class="card">${sub}<div class="vacio"><span class="ic">🤝</span>Las parejas se guardan desde la última versión de la app.<br>Aparecerán aquí en cuanto se grabe el próximo partido.</div></div>`;
  const todas = parejasTemporada(def);
  const ok = todas.filter(x => x.min >= MIN_MUESTRA).sort((a, b) => b.media - a.media || b.imp - a.imp);
  const obs = todas.filter(x => x.min < MIN_MUESTRA && x.min > 0).sort((a, b) => b.min - a.min);
  const max = Math.max(...ok.map(x => Math.abs(x.media)), 0.01);
  const nom = x => `${esc(x.a)} <span style="color:var(--gris2)">+</span> ${esc(x.b)}`;
  return `<div class="card">${sub}
    <div class="card-t"><span>${def ? '🛡️ Parejas en defensa' : '🤝 Parejas que mejor funcionan'}</span><span>${conDatos} ${conDatos === 1 ? 'partido' : 'partidos'}</span></div>
    ${ok.length ? ok.slice(0, estado.parTodas ? ok.length : 10).map((x, i) => `<div class="fila"><span class="pos">${i + 1}</span>
        <div class="nom" style="white-space:normal;">${nom(x)}<div class="sub">${x.min}' juntos · ${x.pj} PJ · impacto ${signo(x.imp, 1)}</div>
          <div class="barra" style="margin-top:5px;"><i style="width:${Math.max(3, Math.abs(x.media) / max * 100)}%; ${x.media < 0 ? 'background:var(--rojo);' : ''}"></i></div></div>
        <div class="val ${colV(x.media)}">${signo(x.media, 2)}</div></div>`).join('')
      : `<div class="vacio">Ninguna pareja llega aún a ${MIN_MUESTRA}' juntos.</div>`}
    ${ok.length > 10 ? `<button class="seg" style="width:100%; margin-top:10px; padding:10px;" data-partodas="1">${estado.parTodas ? 'Ver solo las 10 mejores' : `Ver todas (${ok.length})`}</button>` : ''}
    ${obs.length ? bloqueObs('EN OBSERVACIÓN', `Menos de ${MIN_MUESTRA}' juntos`, obs.slice(0, 12).map(x => `<div class="fila"><div class="nom" style="white-space:normal;">${nom(x)}</div><div class="sub" style="margin:0;">${x.min}'</div></div>`).join('')) : ''}
    <div class="nota">${def ? 'Solo cuenta el tiempo en que los dos juegan a la vez en posiciones defensivas. ' : ''}El número es el impacto de la pareja por partido jugando juntos: goles a favor menos en contra mientras coinciden, llevado a la duración de un partido.</div>
  </div>`;
}

/* Asistencia (convocatorias de la app) */
function datosAsistencia() {
  const ses = (D.asistencia || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const st = {};
  ses.forEach(se => (se.registros || []).forEach(r => {
    const s = st[r.nombre] || (st[r.nombre] = { si: 0, no: 0, racha: 0 });
    if (r.concepto === 'asistio') s.si++; else s.no++;
  }));
  Object.keys(st).forEach(n => { let r = 0; for (let i = ses.length - 1; i >= 0; i--) { const x = (ses[i].registros || []).find(y => y.nombre === n); if (x && x.concepto === 'asistio') r++; else break; } st[n].racha = r; });
  return { ses, st };
}
function htmlAsistencia() {
  const { ses, st } = datosAsistencia();
  if (!ses.length) return `<div class="card vacio"><span class="ic">📋</span>Aún no hay convocatorias registradas.</div>`;
  const filas = Object.entries(st).map(([n, s]) => ({ n, ...s, tot: s.si + s.no, pct: Math.round(s.si / Math.max(1, s.si + s.no) * 100) }))
    .sort((a, b) => b.pct - a.pct || b.si - a.si);
  const maxR = Math.max(...filas.map(f => f.racha), 0);
  return `<div class="card"><div class="card-t"><span>📋 Asistencia a partidos</span><span>${plural(ses.length, 'convocatoria', 'convocatorias')}</span></div>
    ${filas.map(f => `<div class="fila toque" data-jug="${esc(f.n)}">${circulo(f.n)}
      <div class="nom">${esc(f.n)}<div class="sub">✅ ${f.si} · ❌ ${f.no}${f.racha ? ` · racha ${f.racha === maxR ? '🔥' : ''}${f.racha}` : ''}</div>
        <div class="barra" style="margin-top:5px;"><i style="width:${f.pct}%; background:${f.pct >= 80 ? 'var(--verde)' : f.pct >= 60 ? 'var(--ambar)' : 'var(--rojo)'};"></i></div></div>
      <div class="val" style="color:var(--tiza);">${f.pct}%</div></div>`).join('')}
    <div class="nota">Racha: convocatorias seguidas viniendo, hasta hoy.</div></div>
  <div class="card"><div class="card-t"><span>🗓 Convocatorias</span></div>
    ${ses.slice().reverse().map(se => { const si = (se.registros || []).filter(r => r.concepto === 'asistio').length, tot = (se.registros || []).length;
      const faltan = (se.registros || []).filter(r => r.concepto !== 'asistio').map(r => esc(r.nombre));
      return `<div class="fila"><div class="nom" style="white-space:normal;">⚽ ${esc(se.fecha || '')}<div class="sub">${faltan.length ? '❌ ' + faltan.join(', ') : 'Vinieron todos'}</div></div>
        <div class="val" style="font-size:15px; color:var(--tiza);">${si}/${tot}</div></div>`; }).join('')}</div>`;
}

/* ---------- PANEL (gráficas de equipo) ---------- */
const svgTxt = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-size="${o.s || 9}" fill="${o.c || '#8b9490'}" font-weight="${o.w || 600}" font-family="Inter,sans-serif">${t}</text>`;

function graficaGoles(ps) {
  const W = 320, H = 170, L = 22, R = 6, T = 14, B = 22, n = ps.length;
  const max = Math.max(1, ...ps.map(p => Math.max(p.golesH, p.golesR)));
  const paso = (W - L - R) / n, bw = Math.min(14, paso / 2 - 3), y = v => T + (1 - v / max) * (H - T - B);
  let g = '';
  for (let v = 0; v <= max; v += Math.max(1, Math.ceil(max / 4))) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v ? .06 : .18})"/>${svgTxt(L - 5, y(v) + 3, v, { a: 'end' })}`;
  ps.forEach((p, i) => {
    const cx = L + paso * (i + .5);
    [[p.golesH, '#43d17a', -1], [p.golesR, '#ff5a5f', 1]].forEach(([v, col, lado]) => {
      const x = cx + (lado < 0 ? -bw - 1 : 1), h = (H - T - B) - (y(v) - T);
      if (v > 0) g += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${h}" rx="3" fill="${col}"><title>J${i + 1} vs ${esc(p.rival)}: ${p.golesH}-${p.golesR}</title></rect>`;
      if (v > 0 && n <= 12) g += svgTxt(x + bw / 2, y(v) - 3, v, { c: '#dfe5e3', s: 9 });
    });
    if (n <= 16 || i % 2 === 0) g += svgTxt(cx, H - 7, 'J' + (i + 1));
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Goles a favor y en contra por partido">${g}</svg>
    <div class="leyenda"><span><i style="background:#43d17a"></i>A favor</span><span><i style="background:#ff5a5f"></i>En contra</span></div>`;
}

function graficaBalance(ps) {
  const W = 320, H = 170, L = 26, R = 6, T = 20, B = 24, n = ps.length;
  const vals = ps.map(p => (p.jugadores || []).reduce((s, j) => s + (j.recuperaciones || 0) - (j.perdidas || 0), 0));
  const max = Math.max(1, ...vals.map(Math.abs)), paso = (W - L - R) / n, bw = Math.min(22, paso - 6), mid = T + (H - T - B) / 2;
  const y = v => mid - v / max * ((H - T - B) / 2);
  let g = `<line x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}" stroke="rgba(255,255,255,.2)"/>${svgTxt(L - 5, mid + 3, 0, { a: 'end' })}${svgTxt(L - 5, T + 6, '+' + max, { a: 'end' })}${svgTxt(L - 5, H - B, '−' + max, { a: 'end' })}`;
  vals.forEach((v, i) => {
    const cx = L + paso * (i + .5);
    if (v) g += `<rect x="${cx - bw / 2}" y="${Math.min(y(v), mid)}" width="${bw}" height="${Math.abs(y(v) - mid)}" rx="3" fill="${v > 0 ? '#00d9c4' : '#ff5a5f'}"><title>J${i + 1} vs ${esc(ps[i].rival)}: ${signo(v)}</title></rect>`;
    if (n <= 12) g += svgTxt(cx, v >= 0 ? y(v) - 3 : y(v) + 10, signo(v), { c: '#dfe5e3' });
    if (n <= 16 || i % 2 === 0) g += svgTxt(cx, H - 7, 'J' + (i + 1));
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Balance de balón del equipo por partido">${g}</svg>
    <div class="nota" style="margin-top:4px;">Recuperaciones menos pérdidas de todo el equipo en cada partido.</div>`;
}

function donutPosiciones() {
  const tot = {};
  Object.values(D.historico || {}).forEach(d => Object.entries(d.tiemposPorPosicion || {}).forEach(([k, v]) => { tot[k] = (tot[k] || 0) + (v || 0); }));
  const items = Object.entries(tot).filter(([, v]) => v > 0).map(([k, v]) => ({ id: +k, v })).sort((a, b) => a.id - b.id);
  const suma = items.reduce((s, x) => s + x.v, 0);
  if (!suma) return '<div style="font-size:12.5px; color:var(--gris);">Sin datos de posiciones.</div>';
  const R = 60, r = 36, cx = 70, cy = 70; let ang = -Math.PI / 2, g = '';
  items.forEach(x => {
    const a = x.v / suma * Math.PI * 2, a2 = ang + a, big = a > Math.PI ? 1 : 0;
    const p = (rad, t) => `${(cx + rad * Math.cos(t)).toFixed(2)},${(cy + rad * Math.sin(t)).toFixed(2)}`;
    g += items.length === 1 ? `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${colorPos(x.id)}" stroke-width="${R - r}"/>`
      : `<path d="M${p(R, ang)} A${R},${R} 0 ${big} 1 ${p(R, a2)} L${p(r, a2)} A${r},${r} 0 ${big} 0 ${p(r, ang)} Z" fill="${colorPos(x.id)}" stroke="#17191a" stroke-width="2"><title>${esc(nombrePos(x.id))}: ${Math.round(x.v / 60)}'</title></path>`;
    ang = a2;
  });
  return `<div style="display:flex; align-items:center; gap:14px;"><svg viewBox="0 0 140 140" style="width:46%; max-width:170px; flex-shrink:0;" role="img" aria-label="Minutos por posición">${g}</svg>
    <div style="flex:1; min-width:0;">${items.map(x => `<div style="display:flex; align-items:center; gap:7px; font-size:12px; padding:3px 0;">
      <i style="width:10px; height:10px; border-radius:3px; background:${colorPos(x.id)}; flex-shrink:0;"></i><span style="flex:1; color:var(--tiza); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(nombrePos(x.id))}</span>
      <span style="color:var(--gris);">${Math.round(x.v / suma * 100)}%</span></div>`).join('')}</div></div>`;
}

function htmlTramos(ps) {
  const con = ps.filter(p => Array.isArray(p.golesMin) && p.golesMin.length);
  if (!con.length) return '<div style="font-size:12.5px; color:var(--gris);">Todavía no hay partidos con el minuto de los goles.</div>';
  let maxMin = 0; con.forEach(p => { maxMin = Math.max(maxMin, p.duracion || 0); p.golesMin.forEach(g => { maxMin = Math.max(maxMin, g.min); }); });
  const nT = Math.max(1, Math.ceil(maxMin / 5)), tr = Array.from({ length: nT }, (_, i) => ({ d: i * 5 + 1, h: i * 5 + 5, f: 0, c: 0 }));
  con.forEach(p => p.golesMin.forEach(g => { const t = tr[Math.min(nT - 1, Math.floor((Math.max(1, g.min) - 1) / 5))]; if (g.t === 'F') t.f++; else t.c++; }));
  const maxV = Math.max(1, ...tr.map(t => Math.max(t.f, t.c))), alto = 52;
  const cols = tr.map(t => `<div style="flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;">
    <div style="height:${alto}px; width:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;">${t.f ? `<span style="font-size:10px; font-weight:800; color:var(--verde);">${t.f}</span>` : ''}<div style="width:70%; height:${Math.round(t.f / maxV * (alto - 14))}px; background:#43d17a; border-radius:3px 3px 0 0;"></div></div>
    <div style="width:100%; border-top:1px solid rgba(255,255,255,.3);"></div>
    <div style="height:${alto}px; width:100%; display:flex; flex-direction:column; align-items:center;"><div style="width:70%; height:${Math.round(t.c / maxV * (alto - 14))}px; background:#ff5a5f; border-radius:0 0 3px 3px;"></div>${t.c ? `<span style="font-size:10px; font-weight:800; color:var(--rojo);">${t.c}</span>` : ''}</div>
    <div style="font-size:9px; color:var(--gris2); white-space:nowrap;">${t.h}'</div></div>`).join('');
  const mejorF = [...tr].sort((a, b) => b.f - a.f)[0], peorC = [...tr].sort((a, b) => b.c - a.c)[0];
  const mitad = Math.ceil(tr.length / 2), sum = (a, k) => a.reduce((s, t) => s + t[k], 0), p1 = tr.slice(0, mitad), p2 = tr.slice(mitad), ult = tr.slice(-2);
  const lect = [];
  if (mejorF.f) lect.push(`Más goles a favor entre el ${mejorF.d}' y el ${mejorF.h}' (${mejorF.f}).`);
  if (peorC.c) lect.push(`Más goles encajados entre el ${peorC.d}' y el ${peorC.h}' (${peorC.c}).`);
  lect.push(`1ª parte ${sum(p1, 'f')}-${sum(p1, 'c')} · 2ª parte ${sum(p2, 'f')}-${sum(p2, 'c')}.`);
  if (sum(ult, 'c') || sum(ult, 'f')) lect.push(`Últimos 10 minutos: ${sum(ult, 'f')} a favor y ${sum(ult, 'c')} en contra.`);
  return `<div class="leyenda" style="justify-content:space-between; margin:0 0 6px;"><span><i style="background:#43d17a"></i>A favor (arriba) · <i style="background:#ff5a5f"></i>En contra</span><span>${con.length}/${ps.length} partidos</span></div>
    <div style="display:flex; gap:2px;">${cols}</div>

}

function htmlNivelRival(ps) {
  const orden = ['muy-superior', 'superior', 'similar', 'inferior', 'muy-inferior'];
  const et = { 'muy-superior': '🔥 Muy superior', superior: '💪 Superior', similar: '⚖️ Parecido', inferior: '📉 Asequible', 'muy-inferior': '🟢 Muy asequible' };
  const g = {}; ps.filter(p => p.nivelRival).forEach(p => { const x = g[p.nivelRival] || (g[p.nivelRival] = { v: 0, e: 0, d: 0, gf: 0, gc: 0 }); x[res(p).toLowerCase()]++; x.gf += p.golesH; x.gc += p.golesR; });
  const filas = orden.filter(k => g[k]);
  if (!filas.length) return '<div style="font-size:12.5px; color:var(--gris);">Aún no hay partidos con el nivel del rival.</div>';
  return filas.map(k => { const x = g[k], t = x.v + x.e + x.d;
    return `<div style="margin-bottom:11px;"><div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--tiza);">${et[k]}</b><span style="color:var(--gris);">${plural(t, 'partido', 'partidos')} · ${x.gf}-${x.gc}</span></div>
      <div style="display:flex; gap:2px; height:10px; border-radius:5px; overflow:hidden; background:rgba(255,255,255,.05);">${x.v ? `<div style="flex:${x.v}; background:#43d17a;"></div>` : ''}${x.e ? `<div style="flex:${x.e}; background:#9aa3a0;"></div>` : ''}${x.d ? `<div style="flex:${x.d}; background:#ff5a5f;"></div>` : ''}</div>
      <div class="sub">${x.v}V ${x.e}E ${x.d}D</div></div>`; }).join('')
    + (ps.length - ps.filter(p => p.nivelRival).length ? `<div class="nota">${ps.length - ps.filter(p => p.nivelRival).length} partido(s) sin nivel del rival.</div>` : '');
}

function htmlTarjetas(ps) {
  let p1a = 0, p1r = 0, p2a = 0, p2r = 0;
  ps.forEach(p => (p.tarjetas || []).forEach(t => { const seg = t.minuto > (p.duracion || DUR_DEF) / 2; if (t.tipo === 'TARJETA_RO') { seg ? p2r++ : p1r++; } else { seg ? p2a++ : p1a++; } }));
  const conNombre = Object.entries(D.historico || {}).filter(([, d]) => d.tarjetasAm || d.tarjetasRo).sort((a, b) => ((b[1].tarjetasRo || 0) * 3 + (b[1].tarjetasAm || 0)) - ((a[1].tarjetasRo || 0) * 3 + (a[1].tarjetasAm || 0)));
  if (!(p1a + p1r + p2a + p2r) && !conNombre.length) return '<div style="font-size:12.5px; color:var(--gris);">Sin tarjetas en la temporada.</div>';
  return `<div class="grid3" style="grid-template-columns:1fr 1fr;"><div class="box"><div class="v">🟨 ${p1a} · 🟥 ${p1r}</div><div class="l">1ª parte</div></div><div class="box"><div class="v">🟨 ${p2a} · 🟥 ${p2r}</div><div class="l">2ª parte</div></div></div>
    ${conNombre.map(([n, d]) => `<div class="fila toque" data-jug="${esc(n)}">${circulo(n)}<div class="nom">${esc(n)}</div><div class="val" style="font-size:15px; color:var(--tiza);">${d.tarjetasAm ? '🟨 ' + d.tarjetasAm : ''} ${d.tarjetasRo ? '🟥 ' + d.tarjetasRo : ''}</div></div>`).join('')}`;
}

/* ---------- FICHA DE JUGADOR (temporada) ---------- */
const EVO_MET = { impacto: ['Impacto', j => j.impacto || 0], minutos: ['Minutos', j => j.minutos || 0], goles: ['Goles', j => j.goles || 0], asistencias: ['Asistencias', j => j.asistencias || 0], balance: ['Balance de balón', j => (j.recuperaciones || 0) - (j.perdidas || 0)] };
function graficaEvolucion(nombre, met) {
  const ps = liga(), f = EVO_MET[met][1];
  const pts = ps.map((p, i) => { const j = (p.jugadores || []).find(y => y.nombre === nombre); return { i, p, v: j ? f(j) : null }; });
  const jug = pts.filter(x => x.v !== null);
  if (jug.length < 2) return '<div style="font-size:12.5px; color:var(--gris); padding:6px 0;">Hace falta más de un partido jugado para ver su evolución.</div>';
  const W = 320, H = 150, L = 26, R = 8, T = 12, B = 22, n = ps.length;
  const vals = jug.map(x => x.v), mn = Math.min(0, ...vals), mx = Math.max(1, ...vals);
  const x = k => n === 1 ? (L + W - R) / 2 : L + k / (n - 1) * (W - L - R), y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const media = vals.reduce((s, v) => s + v, 0) / vals.length;
  let g = '';
  [mn, (mn + mx) / 2, mx].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v === 0 ? .18 : .06})"/>${svgTxt(L - 5, y(v) + 3, num(v, Number.isInteger(v) ? 0 : 1), { a: 'end' })}`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(media)}" y2="${y(media)}" stroke="#ffb020" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  g += `<polyline fill="none" stroke="#00d9c4" stroke-width="2" stroke-linejoin="round" points="${jug.map(z => `${x(z.i).toFixed(1)},${y(z.v).toFixed(1)}`).join(' ')}"/>`;
  jug.forEach(z => { g += `<circle cx="${x(z.i)}" cy="${y(z.v)}" r="4.5" fill="#00d9c4" stroke="#202425" stroke-width="2"><title>J${z.i + 1} vs ${esc(z.p.rival)}: ${num(z.v, 1)}</title></circle>`; });
  ps.forEach((p, k) => { if (n <= 12 || k % 2 === 0) g += svgTxt(x(k), H - 7, 'J' + (k + 1)); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de ${esc(nombre)}">${g}</svg>
    <div class="leyenda"><span><i style="background:#00d9c4"></i>${EVO_MET[met][0]} por partido</span><span><i style="background:#ffb020"></i>Su media (${num(media, 1)})</span></div>
    ${jug.length < ps.length ? `<div class="nota" style="margin-top:4px;">Sin punto: partidos que no jugó.</div>` : ''}`;
}

  const x = listaTemporada('todos').find(y => y.nombre === nombre) || { pj:0, min:0, goles:0, asist:0, imp:0, media:0, recuperaciones:0, perdidas:0, tiros:0, pm:0 };

  const pos = Object.entries(tp).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const mvps = hist.filter(z => { const m = mvpDe(z.p); return m && m.nombre === nombre; }).length;
  const minGol = x.goles > 0 ? Math.round(x.min / x.goles) : null;
  const socios = parejasTemporada(false).filter(p => (p.a === nombre || p.b === nombre) && p.min >= MIN_MUESTRA).sort((a, b) => b.media - a.media).slice(0, 3);

  document.getElementById('mJugadorC').innerHTML = `
    <div class="modal-h">${circulo(nombre)}
      <div class="t"><div class="t1">${esc(nombre)}</div><div class="t2">${plural(x.pj, 'partido', 'partidos')} · ${x.min}'${forma ? ` · <span style="color:${forma.c}">${forma.ic} ${forma.t}</span>` : ''}</div></div>

        <div class="box"><div class="v">${mvps}</div><div class="l">MVP</div></div>
        <div class="box"><div class="v">${x.tiros}</div><div class="l">Tiros</div></div>
      </div>
      <div class="card" style="margin-top:10px;">
        <div class="fila"><div class="nom">📊 Impacto medio por partido${x.min < MIN_MUESTRA ? '<div class="sub">Menos de ' + MIN_MUESTRA + "': dato aún poco fiable</div>" : ''}</div><div class="val ${colV(x.media)}">${signo(x.media, 2)}</div></div>
        <div class="fila"><div class="nom">⭐ Impacto total</div><div class="val ${colV(x.imp)}">${signo(x.imp, 1)}</div></div>
        <div class="fila"><div class="nom">🔄 Balance de balón<div class="sub">✅ ${x.recuperaciones} recuperaciones · ❌ ${x.perdidas} pérdidas</div></div><div class="val ${colV(x.recuperaciones - x.perdidas)}">${signo(x.recuperaciones - x.perdidas)}</div></div>
        <div class="fila"><div class="nom">➕ +/- con él en el campo</div><div class="val ${colV(x.pm)}">${signo(x.pm)}</div></div>
        ${minGol ? `<div class="fila"><div class="nom">⏱ Minutos por gol</div><div class="val">${minGol}'</div></div>` : ''}
        ${asi ? `<div class="fila"><div class="nom">📋 Asistencia<div class="sub">✅ ${asi.si} · ❌ ${asi.no}</div></div><div class="val" style="color:var(--tiza);">${Math.round(asi.si / Math.max(1, asi.si + asi.no) * 100)}%</div></div>` : ''}
        ${(d.tarjetasAm || d.tarjetasRo) ? `<div class="fila"><div class="nom">Tarjetas</div><div class="val" style="color:var(--tiza)">🟨 ${d.tarjetasAm || 0} · 🟥 ${d.tarjetasRo || 0}</div></div>` : ''}
        ${(d.minutosPorteria || 0) > 0 ? `<div class="fila"><div class="nom">🧤 En portería<div class="sub">${d.partidosPorteria || 0} PJ · ${d.minutosPorteria}' · ${d.paradasPorteria || 0} paradas · ${d.golesEncajadosPorteria || 0} encajados</div></div></div>` : ''}
      </div>
      <div class="card"><div class="card-t"><span>📈 Evolución</span></div>
        <select class="sel" id="selEvo" aria-label="Dato de la evolución">${Object.entries(EVO_MET).map(([k, [t]]) => `<option value="${k}"${k === estado.evMet ? ' selected' : ''}>${t}</option>`).join('')}</select>
        <div id="evoGraf">${graficaEvolucion(nombre, estado.evMet)}</div>
      </div>
      ${socios.length ? `<div class="card"><div class="card-t"><span>🤝 Con quién funciona mejor</span></div>
        ${socios.map(p => { const otro = p.a === nombre ? p.b : p.a; return `<div class="fila toque" data-jug="${esc(otro)}">${circulo(otro)}<div class="nom">${esc(otro)}<div class="sub">${p.min}' juntos</div></div><div class="val ${colV(p.media)}">${signo(p.media, 2)}</div></div>`; }).join('')}</div>` : ''}
      ${pos.length ? `<div class="card"><div class="card-t"><span>🧭 Dónde juega</span></div>
        ${pos.map(([id, s]) => { const pc = Math.round(s / totS * 100);
          return `<div style="margin-bottom:9px;"><div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--tiza);">${esc(nombrePos(+id))}</b><span style="color:var(--gris);">${Math.round(s / 60)}' · ${pc}%</span></div><div class="barra"><i style="width:${pc}%; background:${colorPos(+id)};"></i></div></div>`; }).join('')}</div>` : ''}
      <div class="card"><div class="card-t"><span>📅 Partido a partido</span><span>impacto</span></div>
        ${hist.length ? hist.map(z => { const v = z.j.impacto || 0, m = mvpDe(z.p);
          const extra = [z.j.goles ? `⚽${z.j.goles > 1 ? '×' + z.j.goles : ''}` : '', z.j.asistencias ? `👟${z.j.asistencias > 1 ? '×' + z.j.asistencias : ''}` : '', m && m.nombre === nombre ? '⭐ MVP' : ''].filter(Boolean).join(' ');
          return `<div class="fila partido" data-partido="${z.i}">
            <div style="flex:1; min-width:0;"><div style="font-size:13px; font-weight:700; color:var(--tiza);">vs ${esc(z.p.rival)} <span class="chip-res ${res(z.p)}" style="font-size:11.5px; padding:1px 6px; margin-left:4px;">${z.p.golesH}–${z.p.golesR}</span></div>
              <div class="sub">${esc(z.p.fecha || '')} · ${z.j.minutos || 0}'${extra ? ' · ' + extra : ''}</div>
              <div class="barra" style="margin-top:5px;"><i style="width:${Math.max(3, Math.abs(v) / maxImp * 100)}%; ${v < 0 ? 'background:var(--rojo);' : ''}"></i></div></div>
            <div class="val ${colV(v)}" style="font-size:15px;">${signo(v, 1)}</div></div>`; }).join('')
          : '<div style="font-size:12px; color:var(--gris);">Todavía no ha jugado ningún partido grabado.</div>'}
      </div>
    </div>`;
  abrir('mJugador');
}

/* ---------- MVP POR BLOQUES ---------- */
function pintarMvp() {
  const el = document.getElementById('p-mvp');
  const ps = liga();
  if (!ps.length) { el.innerHTML = `<div class="card vacio"><span class="ic">🌟</span>El MVP se decide cada 4 partidos de liga.<br>Aparecerá en cuanto se grabe el primero.</div>`; return; }
  const bloques = [];
  for (let i = 0; i < ps.length; i += 4) bloques.push(ps.slice(i, i + 4));
  const actual = bloques[bloques.length - 1], enCursoAct = actual.length < 4;
  const bal = rankingBloque(actual).filter(x => x.rec || x.per).sort((a, b) => (b.rec - b.per) - (a.rec - a.per)).slice(0, 3);
  const med = ['🥇', '🥈', '🥉'];
  const topBal = bal.length ? `<div class="card" style="background:linear-gradient(135deg,rgba(0,137,123,.35),rgba(0,105,92,.2)); border-color:rgba(0,217,196,.3);">
    <div class="card-t" style="color:var(--turq);"><span>🎯 Top 3 balance de balón</span><span>${enCursoAct ? 'bloque en curso' : 'último bloque'}</span></div>
    ${bal.map((x, i) => `<div class="fila toque" data-jug="${esc(x.nombre)}"><span style="font-size:18px; width:22px; text-align:center;">${med[i]}</span><div class="nom">${esc(x.nombre)}<div class="sub">✅ ${x.rec} · ❌ ${x.per}</div></div><div class="val">${signo(x.rec - x.per)}</div></div>`).join('')}
  </div>` : '';
  const bloque = (b, n) => {
    const r = rankingBloque(b), enCurso = b.length < 4;
    if (!r.length) return '';
    const fImp = x => `<span style="color:#64b5f6; font-size:12.5px; margin-right:8px;">${signo(x.imp, 1)} imp</span>`;
    return `<div class="card" style="${enCurso ? '' : 'border-color:rgba(0,217,196,.25);'}">
      <div class="card-t"><span>Bloque ${n}${enCurso ? ` · en curso (${b.length}/4)` : ''}</span><span>${esc(b[0].fecha || '')}${!enCurso ? ' → ' + esc(b[3].fecha || '') : ''}</span></div>
      <div class="fila toque" data-jug="${esc(r[0].nombre)}" style="background:${enCurso ? 'rgba(255,255,255,.03)' : 'rgba(0,217,196,.08)'}; border-radius:12px; padding:12px 10px;">
        <span style="font-size:24px;">${enCurso ? '📈' : '🏅'}</span>
        <div class="nom" style="font-size:15px;">${esc(r[0].nombre)}<div class="sub">${enCurso ? 'Va líder' : 'MVP del bloque'} · ⚽ ${r[0].goles} · 👟 ${r[0].asist} · ${r[0].min}'</div></div>
        <div style="text-align:right;"><div class="val">${signo(r[0].media, 2)} <span style="font-size:11px; color:var(--gris);">med</span></div><div style="color:#64b5f6; font-size:12.5px; font-weight:700;">${signo(r[0].imp, 1)} imp</div></div></div>
      ${r.slice(1).map((x, i) => `<div class="fila toque" data-jug="${esc(x.nombre)}"><span class="pos">${med[i + 1] || i + 2}</span>
        <div class="nom">${esc(x.nombre)}<div class="sub">${x.pj} PJ · ${x.min}'</div></div>${fImp(x)}<div class="val" style="font-size:15px; color:var(--tiza);">${signo(x.media, 2)}</div></div>`).join('')}
      <div class="sub" style="margin-top:8px;">${b.map(p => `vs ${esc(p.rival)} ${p.golesH}–${p.golesR}`).join(' · ')}</div>
    </div>`;
  };
  el.innerHTML = `<div class="aviso" style="color:var(--texto); background:rgba(0,217,196,.06); border-color:rgba(0,217,196,.25);">🌟 Cada 4 partidos de liga se elige un MVP: el jugador con mejor impacto medio (med) en ese bloque. En azul, su impacto total (imp).</div>`
    + topBal + bloques.map((b, i) => ({ b, n: i + 1 })).reverse().map(x => bloque(x.b, x.n)).join('');
}

let zModal = 900;
function abrir(id) { document.getElementById(id).style.zIndex = ++zModal; document.getElementById(id).classList.add('abierto'); document.body.style.overflow = 'hidden'; document.getElementById(id).scrollTop = 0; }
function cerrar(id) { document.getElementById(id).classList.remove('abierto'); if (!document.querySelector('.modal.abierto')) document.body.style.overflow = ''; }
function irTab(t) {
  estado.tab = t;
  document.getElementById('bandaVivo').style.display = t === 'directo' ? 'none' : '';
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + t));
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('.tab'); if (tab) { irTab(tab.dataset.tab); return; }
  const ir = t.closest('[data-tab-ir]'); if (ir) { irTab(ir.dataset.tabIr); return; }
  const c = t.closest('[data-cerrar]'); if (c) { cerrar(c.dataset.cerrar); return; }
  if (t.classList && t.classList.contains('modal')) { cerrar(t.id); return; }

  const det = t.closest('[data-det]'); if (det && estado.ficha) { abrirDetalle(estado.ficha.idx, det.dataset.det); return; }
  const pa = t.closest('[data-partido]'); if (pa) { abrirPartido(+pa.dataset.partido); return; }

  const rv = t.closest('[data-rvista]'); if (rv) { estado.rVista = rv.dataset.rvista; pintarRanking(); return; }
  const pt = t.closest('[data-partodas]'); if (pt) { estado.parTodas = !estado.parTodas; pintarRanking(); return; }
  const pv = t.closest('[data-pvista]'); if (pv) { estado.pVista = pv.dataset.pvista; pintarRanking(); return; }
});

/* ---------- DIRECTO ---------- */
const RUTA_DIR = 'bodyking/directo';
let DIR = null, DIR_TS = 0, dirAbiertoAuto = false, golesPrevios = null, rivalPrevio = null, golTimer = null;
const ORDEN_LINEAS = ['GK', 'DEF', 'PIV', 'MED', 'EXT', 'DEL'];

function dirSegundos() {
  if (!DIR) return 0;
  return DIR.seg + (DIR.enMarcha && !DIR.finalizado ? Math.max(0, Math.floor((Date.now() - DIR_TS) / 1000)) : 0);
}
function dirEstado() {
  if (!DIR) return '';
  if (DIR.finalizado) return 'FINAL';
  const segunda = (DIR.eventos || []).some(e => e.tipo === 'SEGUNDA_PARTE');
  if (DIR.enMarcha) return segunda ? '2ª PARTE' : '1ª PARTE';
  const ult = (DIR.eventos || [])[(DIR.eventos || []).length - 1];
  if (ult && ult.tipo === 'SEGUNDA_PARTE') return 'DESCANSO';
  return dirSegundos() > 0 ? 'EN PAUSA' : 'A PUNTO DE EMPEZAR';
}
const reloj = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

function coordsCampo(sis) {
  const lineas = (sis && sis.lineas) || ['DEF', 'DEF', 'MED', 'MED', 'MED', 'DEL'];
  const usadas = ['GK']; lineas.forEach(l => { if (!usadas.includes(l)) usadas.push(l); });
  usadas.sort((a, b) => ORDEN_LINEAS.indexOf(a) - ORDEN_LINEAS.indexOf(b));
  const n = usadas.length, yDe = {};
  usadas.forEach((l, i) => { yDe[l] = 90 - i * (76 / Math.max(1, n - 1)); });
  const out = { 0: { x: 50, y: yDe.GK } }, grupos = {};
  lineas.forEach((l, i) => (grupos[l] = grupos[l] || []).push(i + 1));
  Object.entries(grupos).forEach(([l, idx]) => {
    const xs = idx.length === 1 ? [50] : idx.length === 2 ? [27, 73] : idx.length === 3 ? [16, 50, 84] : idx.map((_, k) => 12 + k * 76 / (idx.length - 1));
    idx.forEach((pos, k) => { out[pos] = { x: xs[k], y: yDe[l] }; });
  });
  return out;
}

function evIcono(e) {
  return { GOL_FAVOR: '⚽', GOL_CONTRA: '🥅', TARJETA_AM: '', TARJETA_RO: '', CAMBIO: '🔄', PARADA: '', SEGUNDA_PARTE: '', CAMBIO_SISTEMA: '' }[e.tipo] || '';
}
function evTexto(e) {
  if (e.tipo === 'GOL_CONTRA') return `Gol de ${esc(DIR.rival || 'el rival')}`;
  if (e.tipo === 'CAMBIO') { const m = /Sale:\s*(.+?)\s*-\s*Entra:\s*(.+?)(?:\s*\((.+)\))?$/.exec(e.txt || ''); if (m) return `Entra <b style="color:var(--verde); width:auto; font-family:inherit;">${esc(m[2])}</b>, sale ${esc(m[1])}`; }
  if (e.tipo === 'SEGUNDA_PARTE') return 'Descanso · empieza la 2ª parte';
  return esc(e.txt || '');
}

function pintarDirecto() {
  const tab = document.getElementById('tabDirecto');
  const el = document.getElementById('p-directo');
  if (!DIR) {
    tab.style.display = 'none';
    if (estado.tab === 'directo') irTab('resumen');
    pintarBandaVivo();
    return;
  }
  tab.style.display = '';
  if (!dirAbiertoAuto) { dirAbiertoAuto = true; if (estado.tab === 'resumen' && !document.querySelector('.modal.abierto')) irTab('directo'); }
  const est = dirEstado(), vivo = DIR.enMarcha && !DIR.finalizado;
  const js = DIR.jugadores || [];
  const coords = coordsCampo(DIR.sistema);
  const enCampo = js.filter(j => j.enCampo && j.pos != null);
  const banquillo = js.filter(j => !j.enCampo);
  const evs = (DIR.eventos || []).slice().reverse();
  const tabla = js.slice().sort((a, b) => (b.enCampo - a.enCampo) || (b.min - a.min));
  const tarjetas = j => (j.am ? '🟨'.repeat(Math.min(j.am, 2)) : '') + (j.ro ? '🟥' : '');

  el.innerHTML = `
    <div class="marcador">
      <div class="marc-est${vivo ? '' : ' gris'}">${vivo ? '<span class="punto"></span> EN DIRECTO · ' : ''}${est}${DIR.jornada ? ' · ' + esc(DIR.jornada) : ''}</div>
      <div class="marc-fila">
        <div class="marc-eq bk" style="text-align:right;">Bodyking</div>
        <div class="marc-g">${DIR.golesH} – ${DIR.golesR}</div>
        <div class="marc-eq" style="text-align:left;">${esc(DIR.rival || 'Rival')}</div>
      </div>
      <div class="marc-reloj" id="dirReloj">${reloj(dirSegundos())}</div>
      <div style="font-size:11px; color:var(--gris); margin-top:6px;">⛳ Córners ${DIR.corners ? DIR.corners.f : 0} – ${DIR.corners ? DIR.corners.c : 0}</div>
    </div>
    <div class="card">
      <div class="card-t"><span>⏱ Lo que va pasando</span></div>
      ${evs.length ? evs.map(e => `<div class="ev${e.tipo === 'GOL_CONTRA' ? ' rival' : ''}"><b>${e.min}'</b><span>${evIcono(e)} ${evTexto(e)}</span></div>`).join('')
        : '<div style="font-size:12.5px; color:var(--gris);">Aún no ha pasado nada destacado.</div>'}
    </div>
    <div class="card">
      <div class="card-t"><span>🟩 En el campo</span><span>${esc(DIR.sistema ? DIR.sistema.nombre : '')}</span></div>
      <div class="campo"><div class="lin"></div><div class="circ"></div><div class="area" style="top:0;"></div><div class="area" style="bottom:0;"></div>
        ${enCampo.map(j => { const c = coords[j.pos] || { x: 50, y: 50 };
          const extra = (j.g ? '⚽'.repeat(Math.min(j.g, 3)) : '') + tarjetas(j);
          return `<div class="jf${j.pos === 0 ? ' gk' : ''}" style="left:${c.x}%; top:${100 - c.y}%;"><div class="c">${j.d != null ? esc(j.d) : '·'}</div><div class="n">${esc(j.n)}</div>${extra ? `<div class="x">${extra}</div>` : ''}</div>`; }).join('')}
      </div>
      ${banquillo.length ? `<div style="font-size:11.5px; color:var(--gris); margin-top:10px; line-height:1.6;">🪑 Banquillo: ${banquillo.map(j => esc(j.n) + (j.min ? ` <span style="color:var(--gris2)">(${j.min}')</span>` : '')).join(' · ')}</div>` : ''}
    </div>
    <div class="card" style="padding:10px 8px;">
      <div class="card-t" style="padding:0 4px;"><span>👥 Jugadores en este partido</span></div>
      <div class="tabla-wrap"><table class="tb">
        <thead><tr><th>Jugador</th><th>Min</th><th>⚽</th><th>👟</th><th>✅</th><th>❌</th><th>🎯</th><th>🧤</th></tr></thead>
        <tbody>${tabla.map(j => `<tr><td class="n">${j.enCampo ? '' : '<span style="color:var(--gris2)">🪑 </span>'}${esc(j.n)}${tarjetas(j) ? ' ' + tarjetas(j) : ''}</td>
          ${[j.min + "'", j.g, j.a, j.rec, j.per, j.tir, j.par].map((v, k) => `<td class="${(k > 0 && !v) || (k === 0 && !j.min) ? 'cero-v' : ''}">${v}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table></div>
      <div class="nota" style="padding:0 4px;">✅ recuperaciones · ❌ pérdidas · 🎯 tiros · 🧤 paradas. Se actualiza solo.</div>
    </div>`;
  pintarBandaVivo();
}

function pintarBandaVivo() {
  const cont = document.getElementById('bandaVivo');
  if (!cont) return;
  if (!DIR || DIR.finalizado) { cont.innerHTML = ''; return; }
  cont.innerHTML = `<div class="banda-vivo" data-tab-ir="directo"><span class="punto"></span>
    <div class="t">${DIR.enMarcha ? 'En directo' : dirEstado().toLowerCase().replace(/^./, c => c.toUpperCase())} · vs ${esc(DIR.rival || 'Rival')}<div class="sub" style="margin-top:1px;">Toca para seguir el partido</div></div>
    <div class="m">${DIR.golesH} – ${DIR.golesR}</div><span class="flecha">›</span></div>`;
}

function avisoGol() {
  if (!DIR) { golesPrevios = null; return; }
  if (golesPrevios === null || rivalPrevio !== DIR.rival) { golesPrevios = DIR.golesH; rivalPrevio = DIR.rival; return; }
  if (DIR.golesH > golesPrevios && !DIR.finalizado) {
    const g = (DIR.eventos || []).filter(e => e.tipo === 'GOL_FAVOR').pop();
    const quien = g ? (g.txt || '').replace(/^GOL de\s*/, '') : '';
    document.getElementById('golAvisoB').textContent = `Bodyking ${DIR.golesH} – ${DIR.golesR} ${DIR.rival || ''}${quien ? ' · ' + quien : ''}`;
    const b = document.getElementById('golAviso'); b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    clearTimeout(golTimer); golTimer = setTimeout(() => b.classList.remove('on'), 7000);
    try { if (navigator.vibrate && document.visibilityState === 'visible') navigator.vibrate([180, 80, 180]); } catch (e) {}
  }
  golesPrevios = DIR.golesH;
}

function cargarDirecto(obj) {
  if (obj && obj.activo && obj.datos) {
    try { DIR = JSON.parse(obj.datos); DIR_TS = obj.ts || Date.now(); } catch (e) { DIR = null; }
  } else DIR = null;
  avisoGol();
  pintarDirecto();
}
window.__cargarDirecto = cargarDirecto; // para pruebas
setInterval(() => { const r = document.getElementById('dirReloj'); if (r && DIR) r.textContent = reloj(dirSegundos()); }, 1000);
document.getElementById('golAviso').addEventListener('click', e => e.currentTarget.classList.remove('on'));

/* ---------- carga de datos desde Firebase (REST + actualización en directo) ---------- */
function cabecera() {
  const el = document.getElementById('cabEstado');
  if (!META || !META.actualizado) return;
  const f = new Date(META.actualizado);
  el.textContent = `Temporada · actualizado ${f.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} a las ${f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}`;
}
function cargarDatos(obj) {
  if (!obj || !obj.datos) {
    document.getElementById('cabEstado').textContent = 'Aún no hay datos publicados';
    document.getElementById('p-resumen').innerHTML = `<div class="card vacio"><span class="ic">📡</span>La temporada todavía no se ha publicado.<br>Se hace desde la app: Ajustes → Visor online → Publicar ahora.</div>`;
    return;
  }
  try { D = JSON.parse(obj.datos); } catch (e) { console.error(e); return; }
  D.partidos = Array.isArray(D.partidos) ? D.partidos : [];
  META = { actualizado: obj.actualizado };
  cabecera(); pintarTodo();
}
window.__cargarDatos = cargarDatos; // para pruebas

/* ---------- PWA: instalable en el móvil ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
let eventoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; document.getElementById('btnInstalar').style.display = ''; });
document.getElementById('btnInstalar').addEventListener('click', async () => {
  if (!eventoInstalar) return;
  eventoInstalar.prompt();
  try { await eventoInstalar.userChoice; } catch (e) {}
  eventoInstalar = null; document.getElementById('btnInstalar').style.display = 'none';
});
window.addEventListener('appinstalled', () => { document.getElementById('btnInstalar').style.display = 'none'; });

const dbUrl = (new URLSearchParams(location.search).get('db') || DB_URL).trim().replace(/\/+$/, '');
// Se leen los campos uno a uno: la clave de escritura que guarda la app no es legible
async function leerCampos(ruta, campos) {
  const vals = await Promise.all(campos.map(c => fetch(`${dbUrl}/${ruta}/${c}.json`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })));
  const o = {}; campos.forEach((c, i) => { o[c] = vals[i]; }); return o;
}
async function leer() { cargarDatos(await leerCampos(RUTA, ['actualizado', 'datos'])); }
function errorCarga(msg) {
  document.getElementById('cabEstado').textContent = 'Sin conexión con los datos';
  if (!D) document.getElementById('p-resumen').innerHTML = `<div class="card vacio"><span class="ic">⚠️</span>${esc(msg)}</div>`;
}
if (!/^https:\/\//.test(dbUrl)) {
  document.getElementById('avisoConfig').innerHTML = `<div class="aviso">⚙️ Falta configurar el visor: pon la URL de tu base de datos de Firebase en <b>DB_URL</b>, al principio del código de este archivo.</div>`;
  document.getElementById('cabEstado').textContent = 'Sin configurar';
  document.getElementById('p-resumen').innerHTML = '';
} else {
  leer().catch(e => errorCarga('No se ha podido leer la temporada (' + e.message + '). Comprueba la URL y que las reglas de Firebase permitan leer bodyking.'));
  // Firebase manda los cambios al momento por este canal; si se corta, el navegador reconecta solo
  try {
    const es = new EventSource(`${dbUrl}/${RUTA}/actualizado.json`);
    let t = null;
    const recargar = () => { clearTimeout(t); t = setTimeout(() => leer().catch(() => {}), 300); };
    es.addEventListener('put', recargar);
    es.addEventListener('patch', recargar);
  } catch (e) {}
  const leerDirecto = () => leerCampos(RUTA_DIR, ['activo', 'ts', 'datos']).then(cargarDirecto).catch(() => {});
  leerDirecto();
  try {
    const ed = new EventSource(`${dbUrl}/${RUTA_DIR}/ts.json`);
    let td = null;
    const rd = () => { clearTimeout(td); td = setTimeout(leerDirecto, 150); };
    ed.addEventListener('put', rd);
    ed.addEventListener('patch', rd);
  } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { leer().catch(() => {}); leerDirecto(); } });
}
</script>
</body>
