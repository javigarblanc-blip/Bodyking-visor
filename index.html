<!DOCTYPE html>

<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bodyking FC — Visor</title>
<meta name="theme-color" content="#0d0f0f">
<script>try { document.documentElement.setAttribute('data-tema', localStorage.getItem('bk_tema') || 'claro'); } catch (e) { document.documentElement.setAttribute('data-tema', 'claro'); }</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0d0f0f; --ink2:#17191a; --ink3:#202425; --linea:rgba(255,255,255,.07);
    --turq:#00d9c4; --turq-osc:#00332c; --tiza:#f4f6f5; --texto:#dfe5e3; --gris:#8b9490; --gris2:#5f6865;
    --verde:#43d17a; --rojo:#ff5a5f; --ambar:#ffb020; --azul:#64b5f6; --morado:#b388ff;
    --sutil:rgba(255,255,255,.05); --sutil2:rgba(255,255,255,.15); --reja:rgba(255,255,255,.06); --reja0:rgba(255,255,255,.2);
    --sombra:none;
  }
  /* Tema claro (por defecto): como la app */
  html[data-tema="claro"] {
    --ink:#f0f2f5; --ink2:#ffffff; --ink3:#f5f7f7; --linea:rgba(0,0,0,.08);
    --turq:#00897b; --turq-osc:#ffffff; --tiza:#1a1d1e; --texto:#33393b; --gris:#5f6865; --gris2:#8b9490;
    --verde:#2e9e5b; --rojo:#d93a3f; --ambar:#b7791f; --azul:#1976d2; --morado:#7e57c2;
    --sutil:rgba(0,0,0,.04); --sutil2:rgba(0,0,0,.14); --reja:rgba(0,0,0,.07); --reja0:rgba(0,0,0,.25);
    --sombra:0 1px 4px rgba(0,0,0,.07);
  }
  /* Zonas que siempre van oscuras, como en la app: cabecera, marcador, barra inferior y cabeceras de las fichas */
  .cab, .marcador, .tabbar, .modal-h {
    --ink:#0d0f0f; --ink2:#17191a; --ink3:#202425; --linea:rgba(255,255,255,.07);
    --turq:#00d9c4; --turq-osc:#00332c; --tiza:#f4f6f5; --texto:#dfe5e3; --gris:#8b9490; --gris2:#5f6865;
    --sutil:rgba(255,255,255,.05); --sutil2:rgba(255,255,255,.15);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--ink); color:var(--texto);
    min-height:100vh; padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px)); }
  .app { max-width:480px; margin:0 auto; }
  .osw { font-family:'Oswald',sans-serif; }
  button { font-family:inherit; cursor:pointer; }

  /* Cabecera */
  .cab { background:var(--ink2); border:3px solid var(--turq); border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .card { box-shadow:var(--sombra); }
  .tema-btn { border:1px solid var(--turq); color:var(--turq); background:rgba(0,217,196,.08); cursor:pointer; margin-left:0; font-size:12px !important; }
  .cab img { width:52px; height:52px; border-radius:10px; object-fit:contain; background:#fff; flex-shrink:0; }
  .cab-t { font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; color:var(--tiza); letter-spacing:.5px; text-transform:uppercase; line-height:1.1; }
  .cab-s { font-size:11px; color:var(--gris); margin-top:3px; }
  .cab-tag { margin-left:auto; align-self:flex-start; font-size:9.5px; font-weight:700; color:var(--gris); background:var(--sutil); padding:3px 7px; border-radius:6px; white-space:nowrap; }

  /* Tarjetas */
  .card { background:var(--ink2); border:1px solid var(--linea); border-radius:14px; padding:13px; margin-bottom:10px; }
  .card-t { font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--gris); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .nota { font-size:10.5px; color:var(--gris2); line-height:1.45; margin-top:8px; }
  .vacio { text-align:center; padding:26px 12px; color:var(--gris); font-size:12.5px; line-height:1.55; }
  .vacio .ic { font-size:28px; display:block; margin-bottom:8px; }

  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .box { background:var(--ink3); border-radius:10px; padding:9px 4px; text-align:center; }
  .box .v { font-family:'Oswald',sans-serif; font-weight:700; font-size:21px; color:var(--tiza); line-height:1.1; }
  .box .l { font-size:9.5px; color:var(--gris); font-weight:700; text-transform:uppercase; letter-spacing:.3px; margin-top:3px; }

  .bola { width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:var(--ink); }
  .bola.V { background:var(--verde); } .bola.E { background:var(--gris2); } .bola.D { background:var(--rojo); color:#fff; }

  .chip-res { font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; padding:4px 10px; border-radius:8px; white-space:nowrap; }
  .chip-res.V { background:rgba(67,209,122,.14); color:var(--verde); }
  .chip-res.E { background:var(--sutil); color:var(--gris); }
  .chip-res.D { background:rgba(255,90,95,.14); color:var(--rojo); }

  /* Filas */
  .fila { display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid var(--linea); }
  .fila:first-child { border-top:none; }
  .fila.toque { cursor:pointer; }
  .fila.toque:active { background:var(--sutil); }
  .dorsal { width:28px; height:28px; border-radius:50%; flex-shrink:0; background:var(--turq-osc); border:1.5px solid var(--turq); color:var(--turq); display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; }
  .nom { flex:1; min-width:0; font-weight:700; font-size:13.5px; color:var(--tiza); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-size:11px; color:var(--gris); font-weight:500; margin-top:2px; white-space:normal; }
  .val { font-family:'Oswald',sans-serif; font-weight:700; font-size:17px; color:var(--turq); white-space:nowrap; text-align:right; }
  .pos { width:18px; font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; color:var(--gris2); text-align:center; flex-shrink:0; }
  .flecha { color:var(--gris2); font-size:16px; flex-shrink:0; }

  .partido { cursor:pointer; }
  .partido .rv { font-weight:700; font-size:14px; color:var(--tiza); }
  .partido .mt { font-size:11px; color:var(--gris); margin-top:3px; line-height:1.4; }

  /* Controles */
  .segs { display:flex; gap:5px; margin-bottom:10px; flex-wrap:wrap; }
  .seg { flex:1; min-width:0; padding:8px 6px; border-radius:9px; border:1px solid var(--linea); background:var(--ink3); color:var(--gris); font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:.3px; white-space:nowrap; }
  .seg.on { background:var(--turq); color:var(--turq-osc); border-color:var(--turq); }
  select.sel { width:100%; padding:10px; border-radius:10px; background:var(--ink3); color:var(--tiza); border:1px solid var(--linea); font-size:13px; font-family:inherit; margin-bottom:10px; }

  .barra { height:6px; border-radius:3px; background:var(--sutil); overflow:hidden; }
  .barra i { display:block; height:100%; border-radius:3px; background:var(--turq); }

  /* Tabla ficha */
  .tabla-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; }
  table.tb { width:100%; min-width:340px; border-collapse:collapse; font-size:12.5px; }
  .tb th { font-size:10.5px; color:var(--gris); font-weight:700; padding:7px 3px; text-align:center; white-space:nowrap; cursor:pointer; user-select:none; }
  .tb th.on { color:var(--turq); }
  .tb th:first-child, .tb td:first-child { text-align:left; padding-left:6px; }
  .tb td { padding:9px 3px; text-align:center; border-top:1px solid var(--linea); font-weight:600; }
  .tb td.n { font-weight:700; color:var(--tiza); white-space:nowrap; max-width:96px; overflow:hidden; text-overflow:ellipsis; }
  .tb tr.mvp td { background:rgba(0,217,196,.09); }
  .tb tr.mvp td:first-child { box-shadow:inset 3px 0 0 var(--turq); }
  .tb tr.tot td { color:var(--gris); font-weight:800; border-top:2px solid var(--linea); }
  .tb tbody tr.j { cursor:pointer; }
  .pos-v { color:var(--verde); } .neg-v { color:var(--rojo); } .cero-v { color:var(--gris2); }

  .golmin { display:flex; flex-wrap:wrap; gap:6px; }
  .golmin span { font-family:'Oswald',sans-serif; font-weight:600; font-size:12.5px; padding:4px 10px; border-radius:14px; }
  .golmin .F { background:rgba(67,209,122,.15); color:var(--verde); }
  .golmin .C { background:rgba(255,90,95,.14); color:var(--rojo); }

  details.ia summary { font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:.4px; color:var(--morado); cursor:pointer; list-style:none; }
  details.ia summary::-webkit-details-marker { display:none; }
  details.ia .txt { white-space:pre-wrap; font-size:12.5px; line-height:1.6; color:var(--texto); margin-top:10px; }

  /* Modales */
  .modal { position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.78); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:14px 10px 30px; display:none; }
  .modal.abierto { display:block; }
  .modal-c { max-width:480px; margin:0 auto; background:var(--ink2); border-radius:18px; overflow:hidden; border-top:4px solid var(--turq); }
  .modal-h { background:#0d0f0f !important; display:flex; align-items:center; gap:10px; padding:14px; background:var(--ink); }
  .modal-h .t { flex:1; min-width:0; }
  .modal-h .t1 { font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; color:var(--tiza); line-height:1.15; }
  .modal-h .t2 { font-size:11.5px; color:var(--gris); margin-top:3px; line-height:1.4; }
  .cerrar { width:38px; height:38px; flex-shrink:0; border-radius:10px; border:1px solid var(--linea); background:var(--sutil); color:var(--tiza); font-size:17px; }
  .modal-b { padding:12px; }
  .modal-b .card { background:var(--ink3); }
  .modal-b .box { background:var(--ink); }

  /* Barra inferior */
  .tabbar-wrap { position:fixed; left:0; right:0; bottom:0; z-index:500; display:flex; justify-content:center; pointer-events:none; }
  .tabbar { width:100%; max-width:480px; display:flex; pointer-events:auto; background:rgba(23,25,26,.97); border-top:1px solid rgba(255,255,255,.08);
    border-radius:16px 16px 0 0; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)); }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px; border-radius:10px; border:none; background:none; color:var(--gris2);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; letter-spacing:.4px; text-transform:uppercase; }
  .tab .ic { font-size:19px; }
  .tab.on { color:var(--turq); background:rgba(0,217,196,.08); }
  .panel { display:none; } .panel.on { display:block; }

  /* Directo */
  .tab.vivo { color:#ff6b6b; }
  .tab.vivo.on { color:#ff6b6b; background:rgba(255,90,95,.1); }
  .punto { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff5a5f; animation:lat 1.4s ease-in-out infinite; vertical-align:middle; }
  @keyframes lat { 50% { opacity:.25; } }
  @media (prefers-reduced-motion: reduce) { .punto { animation:none; } }
  .banda-vivo { display:flex; align-items:center; gap:10px; background:rgba(255,90,95,.1); border:1px solid rgba(255,90,95,.35); border-radius:14px; padding:11px 13px; margin-bottom:10px; cursor:pointer; }
  .banda-vivo .t { flex:1; min-width:0; font-weight:700; font-size:13px; color:var(--tiza); }
  .banda-vivo .m { font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; color:var(--tiza); white-space:nowrap; }
  .marcador { background:var(--ink); border:1px solid var(--linea); border-radius:16px; padding:16px 12px 14px; margin-bottom:10px; text-align:center; }
  .marc-est { font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; letter-spacing:1px; color:#ff6b6b; margin-bottom:10px; }
  .marc-est.gris { color:var(--gris); }
  .marc-fila { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; }
  .marc-eq { font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.4px; color:var(--gris); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .marc-eq.bk { color:var(--turq); }
  .marc-g { font-family:'Oswald',sans-serif; font-weight:700; font-size:46px; color:var(--tiza); line-height:1; white-space:nowrap; }
  .marc-reloj { font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; color:#ffeb3b; margin-top:8px; letter-spacing:1px; }
  .campo { position:relative; width:100%; aspect-ratio:3/4; border-radius:14px; overflow:hidden; background:repeating-linear-gradient(0deg,#16432a 0 40px,#1a4d31 40px 80px); border:1px solid rgba(255,255,255,.1); }
  .campo .lin { position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(255,255,255,.3); }
  .campo .circ { position:absolute; left:50%; top:50%; width:64px; height:64px; border:1px solid rgba(255,255,255,.3); border-radius:50%; transform:translate(-50%,-50%); }
  .campo .area { position:absolute; left:30%; width:40%; height:10%; border:1px solid rgba(255,255,255,.3); }
  .jf { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; width:78px; }
  .jf .c { width:34px; height:34px; border-radius:50%; background:var(--turq); color:var(--turq-osc); border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; }
  .jf.gk .c { background:#29b6f6; color:#062536; }
  .jf .n { font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); padding:1px 6px; border-radius:5px; max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .jf .x { font-size:10px; line-height:1; }
  .ev { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--linea); font-size:13px; line-height:1.4; }
  .ev:first-child { border-top:none; }
  .ev b { font-family:'Oswald',sans-serif; font-weight:600; color:var(--turq); width:30px; flex-shrink:0; }
  .ev.rival b, .ev.rival { color:var(--gris); }
  #golAviso { display:none; position:fixed; left:12px; right:12px; top:calc(10px + env(safe-area-inset-top,0px)); max-width:456px; margin:0 auto; z-index:1200; text-align:center;
    padding:14px 16px; border-radius:16px; background:var(--turq); color:var(--turq-osc); box-shadow:0 14px 40px -8px rgba(0,217,196,.5); cursor:pointer; }
  #golAviso.on { display:block; animation:entra .35s ease-out; }
  #golAviso .a { font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; letter-spacing:.5px; }
  #golAviso .b { font-weight:700; font-size:13px; margin-top:3px; }
  @keyframes entra { from { transform:translateY(-130%); opacity:0; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { #golAviso.on { animation:none; } }

  .leyenda { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--gris); margin-top:6px; }
  .leyenda i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .tab { font-size:9.5px; letter-spacing:0; padding:7px 1px; min-width:0; }
  .tab .ic { font-size:18px; }

  .info { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; margin-left:4px; border-radius:50%; border:1px solid var(--turq);
    background:none; color:var(--turq); font-size:11px; font-weight:800; font-family:'Inter',sans-serif; line-height:1; padding:0; vertical-align:1px; text-transform:none; letter-spacing:0; }
  .cab .tema-btn[data-guia] { font-size:12px !important; min-width:30px; }
  .guia p, .guia li { font-size:13px; line-height:1.55; color:var(--texto); margin-bottom:6px; }
  .guia ul { padding-left:18px; margin-bottom:6px; }
  .guia b { color:var(--tiza); }
  .guia .ej { background:var(--sutil); border-radius:8px; padding:8px 10px; font-size:12.5px; }
  .guia section { scroll-margin-top:12px; transition:box-shadow .3s; }
  .guia section.marca { box-shadow:0 0 0 2px var(--turq); }

  .pie { text-align:center; font-size:10px; color:var(--gris2); margin:16px 0 4px; line-height:1.5; }
  .pie a { color:inherit; }
  .aviso { background:rgba(255,176,32,.08); border:1px solid rgba(255,176,32,.3); color:var(--ambar); border-radius:12px; padding:10px 12px; font-size:12px; line-height:1.5; margin-bottom:10px; }
</style>
</head>
<body>

<script>
/* =================================================================
   CONFIGURACIÓN — pega aquí la URL de tu Realtime Database de Firebase
   (la misma que pones en la app: Ajustes → Visor online).
   También vale abrir el visor con ?db=https://...firebasedatabase.app
   ================================================================= */
const DB_URL = 'https://bodyking-visor-default-rtdb.europe-west1.firebasedatabase.app';
const RUTA = 'bodyking/temporada';

const DUR_DEF = 50;           // duración por defecto de un partido (min)
const MIN_MUESTRA = 20;       // por debajo, la media se marca como poco fiable
const NIVELES = {
  'muy-superior': 'Rival muy superior', 'superior': 'Rival superior', 'similar': 'Rival parecido',
  'inferior': 'Rival asequible', 'muy-inferior': 'Rival muy asequible'
};

let D = null;          // datos de la temporada
let META = null;       // { actualizado }
let estado = { tab: 'resumen', rCrit: 'media', rRango: 'todos', rVista: 'jug', pVista: 'gen', evMet: 'impacto', jug: null, ficha: null };

/* ---------- utilidades ---------- */
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const num = (v, d = 0) => { const n = Number(v) || 0; return d ? n.toFixed(d).replace('.', ',') : String(Math.round(n * 10) / 10).replace('.', ','); };
const signo = (v, d = 0) => { const n = Number(v) || 0; return (n > 0 ? '+' : '') + num(n, d); };
const colV = v => v > 0 ? 'pos-v' : v < 0 ? 'neg-v' : 'cero-v';
const res = p => p.golesH > p.golesR ? 'V' : p.golesH < p.golesR ? 'D' : 'E';
const liga = () => (D.partidos || []).filter(p => p.tipo !== 'amistoso');
const pm = j => (j.golesFavorPista || 0) - (j.golesContraPista || 0);
const dorsalDe = nombre => { const j = (D.plantilla || []).find(x => x.nombre === nombre); if (j && j.dorsal != null) return j.dorsal;
  for (let i = (D.partidos || []).length - 1; i >= 0; i--) { const x = (D.partidos[i].jugadores || []).find(y => y.nombre === nombre); if (x && x.dorsal != null) return x.dorsal; } return null; };
const circulo = nombre => { const d = dorsalDe(nombre); return `<span class="dorsal">${d != null ? esc(d) : esc(String(nombre || '?').charAt(0))}</span>`; };
const mvpDe = p => (p.jugadores || []).slice().sort((a, b) => (b.impacto || 0) - (a.impacto || 0) || (b.goles || 0) - (a.goles || 0) || (b.asistencias || 0) - (a.asistencias || 0))[0] || null;
const informeDe = p => (D.informes || []).find(i => i.fecha === p.fecha && i.rival === p.rival) || null;
const nombrePos = id => (D.posiciones && D.posiciones[id]) || ['Portero','Lateral izq.','Lateral der.','Extremo izq.','Mediocentro','Extremo der.','Delantero'][id] || ('Pos ' + id);
const idxPartido = p => D.partidos.indexOf(p);
const plural = (n, s, pl) => `${n} ${n === 1 ? s : pl}`;

/* ---------- cálculos (mismo criterio que la app) ---------- */
function listaTemporada(rango) {
  if (rango === 'todos') {
    return Object.entries(D.historico || {}).map(([nombre, d]) => {
      const min = d.minutosTotales || 0, imp = d.impactoTotalAcumulado || 0, pj = d.partidosJugados || 0;
      const dur = pj > 0 ? ((d.minutosDuracionAcumulados || pj * DUR_DEF) / pj) : DUR_DEF;
      return { nombre, pj, min, goles: d.goles || 0, asist: d.asistencias || 0, perdidas: d.perdidas || 0, recuperaciones: d.recuperaciones || 0,
        tiros: d.tiros || 0, imp, media: min > 0 ? imp / min * dur : 0, pm: (d.golesFavorEnPista || 0) - (d.golesContraEnPista || 0),
        am: d.tarjetasAm || 0, ro: d.tarjetasRo || 0 };
    });
  }
  const ps = liga().slice(-parseInt(rango, 10)), acc = {};
  ps.forEach(p => (p.jugadores || []).forEach(j => {
    const a = acc[j.nombre] || (acc[j.nombre] = { pj:0, min:0, goles:0, asist:0, perdidas:0, recuperaciones:0, tiros:0, imp:0, dur:0, pm:0, am:0, ro:0 });
    a.min += j.minutos || 0; a.goles += j.goles || 0; a.asist += j.asistencias || 0; a.perdidas += j.perdidas || 0;
    a.recuperaciones += j.recuperaciones || 0; a.tiros += j.tiros || 0; a.imp += j.impacto || 0; a.pm += pm(j);
    if ((j.minutos || 0) > 0) { a.pj++; a.dur += (p.duracion || DUR_DEF); }
  }));
  return Object.entries(acc).map(([nombre, a]) => ({ nombre, ...a, media: a.min > 0 ? a.imp / a.min * (a.pj ? a.dur / a.pj : DUR_DEF) : 0 }));
}

function rankingBloque(partidos) {
  const ag = {};
  partidos.forEach(p => (p.jugadores || []).forEach(j => {
    const a = ag[j.nombre] || (ag[j.nombre] = { min:0, imp:0, goles:0, asist:0, rec:0, per:0, dur:0, pj:0 });
    a.min += j.minutos || 0; a.imp += j.impacto || 0; a.goles += j.goles || 0; a.asist += j.asistencias || 0;
    a.rec += j.recuperaciones || 0; a.per += j.perdidas || 0; a.dur += (p.duracion || DUR_DEF); a.pj++;
  }));
  return Object.entries(ag).map(([nombre, a]) => ({ nombre, ...a, media: a.min > 0 ? a.imp / a.min * (a.dur / a.pj) : 0 }))
    .filter(x => x.min > 0).sort((a, b) => b.media - a.media || b.imp - a.imp);
}

function formaJugador(nombre) {
  const v = liga().map(p => (p.jugadores || []).find(j => j.nombre === nombre)).filter(Boolean).slice(-4).map(j => j.impacto || 0);
  if (v.length < 2) return null;
  const m = Math.ceil(v.length / 2), a = v.slice(0, m), b = v.slice(m).length ? v.slice(m) : a;
  const dif = b.reduce((s, x) => s + x, 0) / b.length - a.reduce((s, x) => s + x, 0) / a.length;
  if (Math.abs(dif) < 0.4) return { ic: '➖', t: 'Forma estable', c: 'var(--gris)' };
  return dif > 0 ? { ic: '📈', t: 'En alza', c: 'var(--verde)' } : { ic: '📉', t: 'En baja', c: 'var(--rojo)' };
}

/* Rachas de portería (mismo cálculo que la app): minutos sin encajar según el minuto de los goles en contra.
   actual: desde el último gol recibido (sigue en el partido siguiente); max: la más larga de la temporada. */
function rachasPorteria() {
  let actual = 0, max = 0, sinDatos = false;
  liga().forEach(p => {
    const dur = p.duracion || DUR_DEF;
    const cs = (p.golesMin || []).filter(g => g.t === 'C').map(g => Math.min(dur, Math.max(0, g.min))).sort((a, b) => a - b);
    if ((p.golesR || 0) > 0 && !cs.length) { actual = 0; sinDatos = true; return; }
    let prev = 0;
    cs.forEach(m => { max = Math.max(max, actual + m - prev); actual = 0; prev = m; });
    actual += dur - prev; max = Math.max(max, actual);
  });
  return { actual, max, sinDatos };
}

function pintarResumen() {

  const GF = ps.reduce((s, p) => s + (p.golesH || 0), 0), GC = ps.reduce((s, p) => s + (p.golesR || 0), 0);
  let racha = 0, tipo = null;
  for (let i = ps.length - 1; i >= 0; i--) { const r = res(ps[i]); if (!tipo) { tipo = r; racha = 1; } else if (r === tipo) racha++; else break; }
  const rachaTxt = tipo === 'V' ? plural(racha, 'victoria seguida', 'victorias seguidas') : tipo === 'D' ? plural(racha, 'derrota seguida', 'derrotas seguidas') : plural(racha, 'empate seguido', 'empates seguidos');

    </div>
    <div class="card">
      <div class="card-t"><span>🏆 Temporada</span><span>${plural(ps.length, 'partido', 'partidos')}</span></div>
      <div class="grid3">
        <div class="box"><div class="v" style="color:var(--verde)">${V}</div><div class="l">Ganados</div></div>

              const esM = mvp && j.nombre === mvp.nombre;
              return `<tr class="j${esM ? ' mvp' : ''}" data-det="${esc(j.nombre)}"><td class="n">${esM ? '⭐ ' : ''}${esc(j.nombre)}</td>${COLS.map(c => {
                const v = valCol(j, c.k);
                if (c.k === 'pm' || c.k === 'impacto') return `<td class="${colV(v)}" style="font-weight:800;">${c.k === 'pm' ? signo(v) : num(v, 1)}</td>`;
                return `<td class="${v ? '' : 'cero-v'}">${c.k === 'minutos' ? v + "'" : v}</td>`;
              }).join('')}</tr>`;
            }).join('')}
            <tr class="tot"><td>Equipo</td>${COLS.map(c => `<td>${['goles','asistencias','recuperaciones','perdidas','tiros'].includes(c.k) ? tot(c.k) : ''}</td>`).join('')}</tr>
          </tbody>
        </table></div>
        <div class="nota" style="padding:0 4px;">✅ recuperaciones · ❌ pérdidas · 🎯 tiros · Imp impacto. Toca una columna para ordenar o un jugador para ver su detalle.</div>

      ${insightsDe(idx).length ? `<div class="card" style="border-color:rgba(0,217,196,.3);"><div class="card-t" style="color:var(--turq);"><span>🔍 Lo que dicen los datos ${info('insights')}</span></div>${htmlInsights(insightsDe(idx))}</div>` : ''}
      ${inf ? `<div class="card"><details class="ia"><summary>🤖 Informe del partido (IA) ›</summary><div class="txt">${esc(inf.texto)}</div></details></div>` : ''}
    </div>`;
  abrir('mPartido');
}

function abrirDetalle(idx, nombre) {
  const p = D.partidos[idx]; if (!p) return;
  const j = (p.jugadores || []).find(x => x.nombre === nombre); if (!j) return;
  const suyos = (D.partidos || []).filter(x => x.tipo === p.tipo).map(x => (x.jugadores || []).find(y => y.nombre === nombre)).filter(Boolean);
  const filas = COLS.map(c => {
    const v = valCol(j, c.k), m = suyos.length ? suyos.reduce((s, y) => s + valCol(y, c.k), 0) / suyos.length : 0, dif = v - m;
    let cl = 'cero-v', fl = '＝';
    if (Math.abs(dif) >= 0.05) { const bueno = c.k === 'perdidas' ? dif < 0 : dif > 0; cl = bueno ? 'pos-v' : 'neg-v'; fl = dif > 0 ? '▲' : '▼'; }
    const nombreC = { minutos:'Minutos', goles:'Goles', asistencias:'Asistencias', recuperaciones:'Recuperaciones', perdidas:'Pérdidas', tiros:'Tiros', pm:'+/-', impacto:'Impacto' }[c.k];
    const fmt = x => c.k === 'pm' ? signo(x, Number.isInteger(x) ? 0 : 1) : num(x, Number.isInteger(x) ? 0 : 1);
    return `<tr><td class="n">${c.t} <span style="color:var(--gris); font-weight:500; font-size:11px;">${nombreC}</span></td><td style="font-weight:800; color:var(--tiza);">${fmt(v)}</td><td class="cero-v">${num(m, 1)}</td><td class="${cl}" style="font-weight:800;">${fl} ${Math.abs(dif) >= 0.05 ? num(Math.abs(dif), 1) : ''}</td></tr>`;
  }).join('');
  const tp = j.tiemposPorPosicion || {}, totS = Object.values(tp).reduce((s, v) => s + (v || 0), 0);
  const pos = Object.entries(tp).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  document.getElementById('mDetalleC').innerHTML = `
    <div class="modal-h">${circulo(nombre)}
      <div class="t"><div class="t1">${esc(nombre)}</div><div class="t2">vs ${esc(p.rival)} ${p.golesH}–${p.golesR} · ${esc(p.fecha || '')}</div></div>
      <button class="cerrar" data-cerrar="mDetalle" aria-label="Cerrar">✕</button></div>
    <div class="modal-b">
      <div class="card" style="padding:8px;">
        <table class="tb" style="min-width:0;"><thead><tr><th>Dato</th><th>Este partido</th><th>Su media (${suyos.length} PJ)</th><th>Dif.</th></tr></thead><tbody>${filas}</tbody></table>
      </div>
      <div class="card"><div class="card-t"><span>🧭 Dónde jugó</span></div>
        ${pos.length ? pos.map(([id, s]) => { const pc = totS ? Math.round(s / totS * 100) : 0;
          return `<div style="margin-bottom:9px;"><div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--tiza);">${esc(nombrePos(+id))}</b><span style="color:var(--gris);">${Math.round(s / 60)}' · ${pc}%</span></div><div class="barra"><i style="width:${pc}%"></i></div></div>`; }).join('')
          : '<div style="font-size:12px; color:var(--gris);">Sin datos de posición.</div>'}
      </div>
      <button class="seg" style="width:100%; padding:11px;" data-jug="${esc(nombre)}">Ver su ficha de temporada ›</button>
    </div>`;
  abrir('mDetalle');
}

/* ---------- RANKING (Jugadores · Parejas · Asistencia) ---------- */

  asist:  { t: '👟 Asistencias', v: x => x.asist, f: x => x.asist },
  bal:    { t: '🔄 Balance de balón (recup. − pérdidas)', v: x => x.recuperaciones - x.perdidas, f: x => signo(x.recuperaciones - x.perdidas) },
  pm:     { t: '➕ +/- con él en el campo', v: x => x.pm, f: x => signo(x.pm) },
  tiros:  { t: '🎯 Tiros', v: x => x.tiros, f: x => x.tiros },

function htmlRankingJugadores() {

  const ok = esMedia ? lista.filter(x => x.min >= MIN_MUESTRA) : lista.slice();

  ok.sort((a, b) => c.v(b) - c.v(a) || b.min - a.min);
  const max = Math.max(...ok.map(x => Math.abs(c.v(x))), 0.01);
  const nLiga = liga().length;
  const rangos = [['todos', 'Temporada'], ['10', 'Últ. 10'], ['5', 'Últ. 5'], ['3', 'Últ. 3']].filter(([k]) => k === 'todos' || +k < nLiga || k === '3');

  const efic = lista.filter(x => x.goles > 0).map(x => ({ ...x, mpg: Math.round(x.min / x.goles) })).sort((a, b) => a.mpg - b.mpg);

  // Posición de mayor impacto (temporada)

    const pj = d.partidosPorteria || 1, dur = (d.duracionPorteriaAcumulada || pj * DUR_DEF) / pj;

      ${ok.length ? ok.map((x, i) => `<div class="fila toque" data-jug="${esc(x.nombre)}">
          <span class="pos">${i + 1}</span>${circulo(x.nombre)}
          <div class="nom">${esc(x.nombre)}${formaIc(x.nombre)}<div class="sub">${x.pj} PJ · ${x.min}'</div>
            <div class="barra" style="margin-top:5px;"><i style="width:${Math.max(3, Math.abs(c.v(x)) / max * 100)}%; ${c.v(x) < 0 ? 'background:var(--rojo);' : ''}"></i></div></div>
          <div class="val">${c.f(x)}</div></div>`).join('')
        : `<div class="vacio">Nadie llega aún a ${MIN_MUESTRA}' en este periodo.</div>`}
      ${obs.length ? bloqueObs('EN OBSERVACIÓN', `Menos de ${MIN_MUESTRA}': su media aún no es fiable`,
          obs.map(x => `<div class="fila toque" data-jug="${esc(x.nombre)}">${circulo(x.nombre)}<div class="nom">${esc(x.nombre)}</div><div class="sub" style="margin:0;">${x.min}'</div></div>`).join('')) : ''}
      <div class="nota">${estado.rRango === 'todos' ? '📈📉 forma reciente · ' : ''}Toca un jugador para ver su ficha.</div>
    </div>

    <div class="card">
      <div class="card-t"><span>⏱ Reparto de minutos ${info('minutos')}</span><span>media ${mediaIdeal}'</span></div>
      ${porMin.map(x => { const d = x.min - mediaIdeal; return `<div class="toque" data-jug="${esc(x.nombre)}" style="margin-bottom:9px; cursor:pointer;">
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--tiza);">${esc(x.nombre)}</b>

          <div style="position:absolute; left:0; top:0; bottom:0; width:${x.min / maxMin * 100}%; border-radius:4px; background:${d >= 0 ? 'var(--turq)' : 'var(--gris2)'};"></div>
          <div style="position:absolute; left:${pMed}%; top:-3px; bottom:-3px; width:2px; background:var(--ambar); border-radius:1px;"></div></div></div>`; }).join('')}
      <div class="nota">La raya amarilla es la media de minutos del grupo (${mediaIdeal}'). En gris, quien está por debajo.</div>

      ${ga.length ? `<div class="tabla-wrap"><table class="tb" style="min-width:0;">

          <td style="font-weight:800; color:var(--turq);">${x.goles + x.asist}</td><td class="${x.goles ? '' : 'cero-v'}">${x.goles ? Math.round(x.min / x.goles) + "'" : '—'}</td></tr>`).join('')}</tbody></table></div>`
        : '<div style="font-size:12.5px; color:var(--gris);">Aún no hay goles ni asistencias en este periodo.</div>'}
      ${efic.length ? `<div class="osw" style="font-weight:600; font-size:12px; letter-spacing:.6px; color:var(--gris); margin:14px 0 4px;">🎯 EFICIENCIA GOLEADORA</div>
        ${efic.map((x, i) => `<div class="fila toque" data-jug="${esc(x.nombre)}"><span class="pos">${i + 1}</span><div class="nom">${esc(x.nombre)}<div class="sub">${plural(x.goles, 'gol', 'goles')} en ${x.min}'</div></div>

          <span style="display:flex; align-items:center; gap:6px;"><span style="background:${colorPos(x.id)}; color:#0d0f0f; font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px;">${esc(nombrePos(x.id))}</span>
          <b class="${colV(x.val)}" style="font-size:13px;">${signo(x.val, 1)}</b></span></div>
        <div class="barra"><i style="width:${x.pct}%; background:${colorPos(x.id)};"></i></div></div>`).join('')}

    ${porteros.length ? `<div class="card"><div class="card-t"><span>🧤 Porteros ${info('porteros')}</span><span>goles encajados por partido</span></div>

      ${porteros.map(x => `<div class="fila toque" data-jug="${esc(x.nombre)}">${circulo(x.nombre)}
        <div class="nom">${esc(x.nombre)}<div class="sub">${x.pj} PJ · ${x.min}' · 🧤 ${x.par} paradas · 🥅 ${x.enc} encajados${x.pct != null ? ` · ${x.pct}% paradas` : ''}</div></div>

/* Parejas: suma las parejas que guarda cada partido (desde que la app las graba) */
function parejasTemporada(def) {
  const acc = {};
  liga().forEach(p => (p.parejas || []).forEach(x => {
    const seg = def ? x.segDef : x.seg, imp = def ? x.impDef : x.imp;
    if (!seg) return;
    const [a, b] = [x.a, x.b].sort(), k = a + '\u0001' + b;
    const s = acc[k] || (acc[k] = { a, b, seg: 0, imp: 0, pj: 0, dur: 0 });
    s.seg += seg; s.imp += imp; s.pj++; s.dur += (p.duracion || DUR_DEF);
  }));
  return Object.values(acc).map(s => ({ ...s, min: Math.floor(s.seg / 60), media: s.seg > 0 ? s.imp / (s.seg / 60) * (s.dur / s.pj) : 0 }));
}
function htmlParejas() {
  const def = estado.pVista === 'def';
  const conDatos = liga().filter(p => Array.isArray(p.parejas) && p.parejas.length).length;
  const sub = `<div class="segs">${[['gen', '🤝 En el campo'], ['def', '🛡️ En defensa']].map(([k, t]) => `<button class="seg${estado.pVista === k ? ' on' : ''}" data-pvista="${k}">${t}</button>`).join('')}</div>`;
  if (!conDatos) return `<div class="card">${sub}<div class="vacio"><span class="ic">🤝</span>Las parejas se guardan desde la última versión de la app.<br>Aparecerán aquí en cuanto se grabe el próximo partido.</div></div>`;
  const todas = parejasTemporada(def);
  const ok = todas.filter(x => x.min >= MIN_MUESTRA).sort((a, b) => b.media - a.media || b.imp - a.imp);
  const obs = todas.filter(x => x.min < MIN_MUESTRA && x.min > 0).sort((a, b) => b.min - a.min);
  const max = Math.max(...ok.map(x => Math.abs(x.media)), 0.01);
  const nom = x => `${esc(x.a)} <span style="color:var(--gris2)">+</span> ${esc(x.b)}`;
  return `<div class="card">${sub}
    <div class="card-t"><span>${def ? '🛡️ Parejas en defensa' : '🤝 Parejas que mejor funcionan'} ${info('parejas')}</span><span>${conDatos} ${conDatos === 1 ? 'partido' : 'partidos'}</span></div>
    ${ok.length ? ok.slice(0, estado.parTodas ? ok.length : 10).map((x, i) => `<div class="fila"><span class="pos">${i + 1}</span>
        <div class="nom" style="white-space:normal;">${nom(x)}<div class="sub">${x.min}' juntos · ${x.pj} PJ · impacto ${signo(x.imp, 1)}</div>
          <div class="barra" style="margin-top:5px;"><i style="width:${Math.max(3, Math.abs(x.media) / max * 100)}%; ${x.media < 0 ? 'background:var(--rojo);' : ''}"></i></div></div>
        <div class="val ${colV(x.media)}">${signo(x.media, 2)}</div></div>`).join('')
      : `<div class="vacio">Ninguna pareja llega aún a ${MIN_MUESTRA}' juntos.</div>`}
    ${ok.length > 10 ? `<button class="seg" style="width:100%; margin-top:10px; padding:10px;" data-partodas="1">${estado.parTodas ? 'Ver solo las 10 mejores' : `Ver todas (${ok.length})`}</button>` : ''}
    ${obs.length ? bloqueObs('EN OBSERVACIÓN', `Menos de ${MIN_MUESTRA}' juntos`, obs.slice(0, 12).map(x => `<div class="fila"><div class="nom" style="white-space:normal;">${nom(x)}</div><div class="sub" style="margin:0;">${x.min}'</div></div>`).join('')) : ''}
    <div class="nota">Impacto por partido jugando juntos · mínimo ${MIN_MUESTRA}' juntos.</div>
  </div>`;
}

/* Asistencia (convocatorias de la app) */
function datosAsistencia() {
  const ses = (D.asistencia || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const st = {};
  ses.forEach(se => (se.registros || []).forEach(r => {
    const s = st[r.nombre] || (st[r.nombre] = { si: 0, no: 0, racha: 0 });
    if (r.concepto === 'asistio') s.si++; else s.no++;
  }));
  Object.keys(st).forEach(n => { let r = 0; for (let i = ses.length - 1; i >= 0; i--) { const x = (ses[i].registros || []).find(y => y.nombre === n); if (x && x.concepto === 'asistio') r++; else break; } st[n].racha = r; });
  return { ses, st };
}
function htmlAsistencia() {
  const { ses, st } = datosAsistencia();
  if (!ses.length) return `<div class="card vacio"><span class="ic">📋</span>Aún no hay convocatorias registradas.</div>`;
  const filas = Object.entries(st).map(([n, s]) => ({ n, ...s, tot: s.si + s.no, pct: Math.round(s.si / Math.max(1, s.si + s.no) * 100) }))
    .sort((a, b) => b.pct - a.pct || b.si - a.si);
  const maxR = Math.max(...filas.map(f => f.racha), 0);
  return `<div class="card"><div class="card-t"><span>📋 Asistencia a partidos ${info('asistencia')}</span><span>${plural(ses.length, 'convocatoria', 'convocatorias')}</span></div>
    ${filas.map(f => `<div class="fila toque" data-jug="${esc(f.n)}">${circulo(f.n)}
      <div class="nom">${esc(f.n)}<div class="sub">✅ ${f.si} · ❌ ${f.no}${f.racha ? ` · racha ${f.racha === maxR ? '🔥' : ''}${f.racha}` : ''}</div>
        <div class="barra" style="margin-top:5px;"><i style="width:${f.pct}%; background:${f.pct >= 80 ? 'var(--verde)' : f.pct >= 60 ? 'var(--ambar)' : 'var(--rojo)'};"></i></div></div>
      <div class="val" style="color:var(--tiza);">${f.pct}%</div></div>`).join('')}
    <div class="nota">Racha: convocatorias seguidas viniendo, hasta hoy.</div></div>
  <div class="card"><div class="card-t"><span>🗓 Convocatorias</span></div>
    ${ses.slice().reverse().map(se => { const si = (se.registros || []).filter(r => r.concepto === 'asistio').length, tot = (se.registros || []).length;
      const faltan = (se.registros || []).filter(r => r.concepto !== 'asistio').map(r => esc(r.nombre));
      return `<div class="fila"><div class="nom" style="white-space:normal;">⚽ ${esc(se.fecha || '')}<div class="sub">${faltan.length ? '❌ ' + faltan.join(', ') : 'Vinieron todos'}</div></div>
        <div class="val" style="font-size:15px; color:var(--tiza);">${si}/${tot}</div></div>`; }).join('')}</div>`;
}

/* ---------- PANEL (gráficas de equipo) ---------- */
const svgTxt = (x, y, t, o = {}) => `<text x="${x}" y="${y}" text-anchor="${o.a || 'middle'}" font-size="${o.s || 9}" style="fill:${o.c || 'var(--gris)'}" font-weight="${o.w || 600}" font-family="Inter,sans-serif">${t}</text>`;

function graficaGoles(ps) {
  const W = 320, H = 170, L = 22, R = 6, T = 14, B = 22, n = ps.length;
  const max = Math.max(1, ...ps.map(p => Math.max(p.golesH, p.golesR)));
  const paso = (W - L - R) / n, bw = Math.min(14, paso / 2 - 3), y = v => T + (1 - v / max) * (H - T - B);
  let g = '';
  for (let v = 0; v <= max; v += Math.max(1, Math.ceil(max / 4))) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(${v ? '--reja' : '--reja0'})"/>${svgTxt(L - 5, y(v) + 3, v, { a: 'end' })}`;
  ps.forEach((p, i) => {
    const cx = L + paso * (i + .5);
    [[p.golesH, 'var(--verde)', -1], [p.golesR, 'var(--rojo)', 1]].forEach(([v, col, lado]) => {
      const x = cx + (lado < 0 ? -bw - 1 : 1), h = (H - T - B) - (y(v) - T);
      if (v > 0) g += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${h}" rx="3" style="fill:${col}"><title>J${i + 1} vs ${esc(p.rival)}: ${p.golesH}-${p.golesR}</title></rect>`;
      if (v > 0 && n <= 12) g += svgTxt(x + bw / 2, y(v) - 3, v, { c: 'var(--tiza)', s: 9 });
    });
    if (n <= 16 || i % 2 === 0) g += svgTxt(cx, H - 7, 'J' + (i + 1));
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Goles a favor y en contra por partido">${g}</svg>
    <div class="leyenda"><span><i style="background:var(--verde)"></i>A favor</span><span><i style="background:var(--rojo)"></i>En contra</span></div>`;
}

function graficaBalance(ps) {
  const W = 320, H = 170, L = 26, R = 6, T = 20, B = 24, n = ps.length;
  const vals = ps.map(p => (p.jugadores || []).reduce((s, j) => s + (j.recuperaciones || 0) - (j.perdidas || 0), 0));
  const max = Math.max(1, ...vals.map(Math.abs)), paso = (W - L - R) / n, bw = Math.min(22, paso - 6), mid = T + (H - T - B) / 2;
  const y = v => mid - v / max * ((H - T - B) / 2);
  let g = `<line x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}" style="stroke:var(--reja0)"/>${svgTxt(L - 5, mid + 3, 0, { a: 'end' })}${svgTxt(L - 5, T + 6, '+' + max, { a: 'end' })}${svgTxt(L - 5, H - B, '−' + max, { a: 'end' })}`;
  vals.forEach((v, i) => {
    const cx = L + paso * (i + .5);
    if (v) g += `<rect x="${cx - bw / 2}" y="${Math.min(y(v), mid)}" width="${bw}" height="${Math.abs(y(v) - mid)}" rx="3" style="fill:${v > 0 ? 'var(--turq)' : 'var(--rojo)'}"><title>J${i + 1} vs ${esc(ps[i].rival)}: ${signo(v)}</title></rect>`;
    if (n <= 12) g += svgTxt(cx, v >= 0 ? y(v) - 3 : y(v) + 10, signo(v), { c: 'var(--tiza)' });
    if (n <= 16 || i % 2 === 0) g += svgTxt(cx, H - 7, 'J' + (i + 1));
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Balance de balón del equipo por partido">${g}</svg>
    <div class="nota" style="margin-top:4px;">Recuperaciones menos pérdidas de todo el equipo en cada partido.</div>`;
}

function htmlTramos(ps) {
  const con = ps.filter(p => Array.isArray(p.golesMin) && p.golesMin.length);
  if (!con.length) return '<div style="font-size:12.5px; color:var(--gris);">Todavía no hay partidos con el minuto de los goles.</div>';
  let maxMin = 0; con.forEach(p => { maxMin = Math.max(maxMin, p.duracion || 0); p.golesMin.forEach(g => { maxMin = Math.max(maxMin, g.min); }); });
  const nT = Math.max(1, Math.ceil(maxMin / 5)), tr = Array.from({ length: nT }, (_, i) => ({ d: i * 5 + 1, h: i * 5 + 5, f: 0, c: 0 }));
  con.forEach(p => p.golesMin.forEach(g => { const t = tr[Math.min(nT - 1, Math.floor((Math.max(1, g.min) - 1) / 5))]; if (g.t === 'F') t.f++; else t.c++; }));
  const maxV = Math.max(1, ...tr.map(t => Math.max(t.f, t.c))), alto = 52;
  const cols = tr.map(t => `<div style="flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;">
    <div style="height:${alto}px; width:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;">${t.f ? `<span style="font-size:10px; font-weight:800; color:var(--verde);">${t.f}</span>` : ''}<div style="width:70%; height:${Math.round(t.f / maxV * (alto - 14))}px; background:var(--verde); border-radius:3px 3px 0 0;"></div></div>
    <div style="width:100%; border-top:1px solid var(--sutil2);"></div>
    <div style="height:${alto}px; width:100%; display:flex; flex-direction:column; align-items:center;"><div style="width:70%; height:${Math.round(t.c / maxV * (alto - 14))}px; background:var(--rojo); border-radius:0 0 3px 3px;"></div>${t.c ? `<span style="font-size:10px; font-weight:800; color:var(--rojo);">${t.c}</span>` : ''}</div>
    <div style="font-size:9px; color:var(--gris2); white-space:nowrap;">${t.h}'</div></div>`).join('');
  const mejorF = [...tr].sort((a, b) => b.f - a.f)[0], peorC = [...tr].sort((a, b) => b.c - a.c)[0];
  const mitad = Math.ceil(tr.length / 2), sum = (a, k) => a.reduce((s, t) => s + t[k], 0), p1 = tr.slice(0, mitad), p2 = tr.slice(mitad), ult = tr.slice(-2);
  const lect = [];
  if (mejorF.f) lect.push(`Más goles a favor entre el ${mejorF.d}' y el ${mejorF.h}' (${mejorF.f}).`);
  if (peorC.c) lect.push(`Más goles encajados entre el ${peorC.d}' y el ${peorC.h}' (${peorC.c}).`);
  lect.push(`1ª parte ${sum(p1, 'f')}-${sum(p1, 'c')} · 2ª parte ${sum(p2, 'f')}-${sum(p2, 'c')}.`);
  if (sum(ult, 'c') || sum(ult, 'f')) lect.push(`Últimos 10 minutos: ${sum(ult, 'f')} a favor y ${sum(ult, 'c')} en contra.`);
  return `<div class="leyenda" style="justify-content:space-between; margin:0 0 6px;"><span><i style="background:var(--verde)"></i>A favor (arriba) · <i style="background:var(--rojo)"></i>En contra</span><span>${con.length}/${ps.length} partidos</span></div>
    <div style="display:flex; gap:2px;">${cols}</div>
    <div style="font-size:12.5px; line-height:1.55; margin-top:10px; color:var(--texto);">${lect.join('<br>')}</div>`;
}

function htmlNivelRival(ps) {
  const orden = ['muy-superior', 'superior', 'similar', 'inferior', 'muy-inferior'];
  const et = { 'muy-superior': '🔥 Muy superior', superior: '💪 Superior', similar: '⚖️ Parecido', inferior: '📉 Asequible', 'muy-inferior': '🟢 Muy asequible' };
  const g = {}; ps.filter(p => p.nivelRival).forEach(p => { const x = g[p.nivelRival] || (g[p.nivelRival] = { v: 0, e: 0, d: 0, gf: 0, gc: 0 }); x[res(p).toLowerCase()]++; x.gf += p.golesH; x.gc += p.golesR; });
  const filas = orden.filter(k => g[k]);
  if (!filas.length) return '<div style="font-size:12.5px; color:var(--gris);">Aún no hay partidos con el nivel del rival.</div>';
  return filas.map(k => { const x = g[k], t = x.v + x.e + x.d;
    return `<div style="margin-bottom:11px;"><div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--tiza);">${et[k]}</b><span style="color:var(--gris);">${plural(t, 'partido', 'partidos')} · ${x.gf}-${x.gc}</span></div>
      <div style="display:flex; gap:2px; height:10px; border-radius:5px; overflow:hidden; background:var(--sutil);">${x.v ? `<div style="flex:${x.v}; background:var(--verde);"></div>` : ''}${x.e ? `<div style="flex:${x.e}; background:var(--gris);"></div>` : ''}${x.d ? `<div style="flex:${x.d}; background:var(--rojo);"></div>` : ''}</div>
      <div class="sub">${x.v}V ${x.e}E ${x.d}D</div></div>`; }).join('')
    + (ps.length - ps.filter(p => p.nivelRival).length ? `<div class="nota">${ps.length - ps.filter(p => p.nivelRival).length} partido(s) sin nivel del rival.</div>` : '');
}

function htmlTarjetas(ps) {
  let p1a = 0, p1r = 0, p2a = 0, p2r = 0;
  ps.forEach(p => (p.tarjetas || []).forEach(t => { const seg = t.minuto > (p.duracion || DUR_DEF) / 2; if (t.tipo === 'TARJETA_RO') { seg ? p2r++ : p1r++; } else { seg ? p2a++ : p1a++; } }));
  const conNombre = Object.entries(D.historico || {}).filter(([, d]) => d.tarjetasAm || d.tarjetasRo).sort((a, b) => ((b[1].tarjetasRo || 0) * 3 + (b[1].tarjetasAm || 0)) - ((a[1].tarjetasRo || 0) * 3 + (a[1].tarjetasAm || 0)));
  if (!(p1a + p1r + p2a + p2r) && !conNombre.length) return '<div style="font-size:12.5px; color:var(--gris);">Sin tarjetas en la temporada.</div>';
  return `<div class="grid3" style="grid-template-columns:1fr 1fr;"><div class="box"><div class="v">🟨 ${p1a} · 🟥 ${p1r}</div><div class="l">1ª parte</div></div><div class="box"><div class="v">🟨 ${p2a} · 🟥 ${p2r}</div><div class="l">2ª parte</div></div></div>
    ${conNombre.map(([n, d]) => `<div class="fila toque" data-jug="${esc(n)}">${circulo(n)}<div class="nom">${esc(n)}</div><div class="val" style="font-size:15px; color:var(--tiza);">${d.tarjetasAm ? '🟨 ' + d.tarjetasAm : ''} ${d.tarjetasRo ? '🟥 ' + d.tarjetasRo : ''}</div></div>`).join('')}`;
}

function pintarPanel() {
  const el = document.getElementById('p-panel');

/* ---------- FICHA DE JUGADOR (temporada) ---------- */
const EVO_MET = { impacto: ['Impacto', j => j.impacto || 0], minutos: ['Minutos', j => j.minutos || 0], goles: ['Goles', j => j.goles || 0], asistencias: ['Asistencias', j => j.asistencias || 0], balance: ['Balance de balón', j => (j.recuperaciones || 0) - (j.perdidas || 0)] };
function graficaEvolucion(nombre, met) {
  const ps = liga(), f = EVO_MET[met][1];
  const pts = ps.map((p, i) => { const j = (p.jugadores || []).find(y => y.nombre === nombre); return { i, p, v: j ? f(j) : null }; });
  const jug = pts.filter(x => x.v !== null);
  if (jug.length < 2) return '<div style="font-size:12.5px; color:var(--gris); padding:6px 0;">Hace falta más de un partido jugado para ver su evolución.</div>';
  const W = 320, H = 150, L = 26, R = 8, T = 12, B = 22, n = ps.length;
  const vals = jug.map(x => x.v), mn = Math.min(0, ...vals), mx = Math.max(1, ...vals);
  const x = k => n === 1 ? (L + W - R) / 2 : L + k / (n - 1) * (W - L - R), y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const media = vals.reduce((s, v) => s + v, 0) / vals.length;
  let g = '';
  [mn, (mn + mx) / 2, mx].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(${v === 0 ? '--reja0' : '--reja'})"/>${svgTxt(L - 5, y(v) + 3, num(v, Number.isInteger(v) ? 0 : 1), { a: 'end' })}`; });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(media)}" y2="${y(media)}" style="stroke:var(--ambar)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  g += `<polyline fill="none" style="stroke:var(--turq)" stroke-width="2" stroke-linejoin="round" points="${jug.map(z => `${x(z.i).toFixed(1)},${y(z.v).toFixed(1)}`).join(' ')}"/>`;
  jug.forEach(z => { g += `<circle cx="${x(z.i)}" cy="${y(z.v)}" r="4.5" style="fill:var(--turq); stroke:var(--ink3)" stroke-width="2"><title>J${z.i + 1} vs ${esc(z.p.rival)}: ${num(z.v, 1)}</title></circle>`; });
  ps.forEach((p, k) => { if (n <= 12 || k % 2 === 0) g += svgTxt(x(k), H - 7, 'J' + (k + 1)); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de ${esc(nombre)}">${g}</svg>
    <div class="leyenda"><span><i style="background:var(--turq)"></i>${EVO_MET[met][0]} por partido</span><span><i style="background:var(--ambar)"></i>Su media (${num(media, 1)})</span></div>
    ${jug.length < ps.length ? `<div class="nota" style="margin-top:4px;">Sin punto: partidos que no jugó.</div>` : ''}`;
}

              <div class="sub">${esc(z.p.fecha || '')} · ${z.j.minutos || 0}'${extra ? ' · ' + extra : ''}</div>
              <div class="barra" style="margin-top:5px;"><i style="width:${Math.max(3, Math.abs(v) / maxImp * 100)}%; ${v < 0 ? 'background:var(--rojo);' : ''}"></i></div></div>
            <div class="val ${colV(v)}" style="font-size:15px;">${signo(v, 1)}</div></div>`; }).join('')
          : '<div style="font-size:12px; color:var(--gris);">Todavía no ha jugado ningún partido grabado.</div>'}
      </div>
    </div>`;
  abrir('mJugador');
}

      ${r.slice(1).map((x, i) => `<div class="fila toque" data-jug="${esc(x.nombre)}"><span class="pos">${med[i + 1] || i + 2}</span>
        <div class="nom">${esc(x.nombre)}<div class="sub">${x.pj} PJ · ${x.min}'</div></div>${fImp(x)}<div class="val" style="font-size:15px; color:var(--tiza);">${signo(x.media, 2)}</div></div>`).join('')}
      <div class="sub" style="margin-top:8px;">${b.map(p => `vs ${esc(p.rival)} ${p.golesH}–${p.golesR}`).join(' · ')}</div>

/* ── INSIGHTS AUTOMÁTICOS (mismo cálculo en app y visor) ──
   Detectores fijos, sin IA: miran los partidos de liga grabados hasta cada partido
   y sacan las frases más llamativas. Los "patrones" (tendencias de temporada)
   no se repiten si ya salieron en uno de los 2 partidos de liga anteriores. */
function calcularInsightsTodos(partidos, durDef) {
    durDef = durDef || 50;
    const todos = Array.isArray(partidos) ? partidos : [];
    const out = {};
    const liga = [], idxs = [], mostrados = [];
    todos.forEach((p, i) => {
        if (!p || p.tipo === 'amistoso') return;
        liga.push(p); idxs.push(i);
        const n = liga.length - 1;
        const prev = new Set([].concat(mostrados[n - 1] || [], mostrados[n - 2] || []));
        const lista = insightsBase(liga.slice(), durDef)
            .filter(x => !(x.patron && prev.has(x.clave)))
            .sort((a, b) => b.peso - a.peso)
            .slice(0, 4);
        mostrados.push(lista.filter(x => x.patron).map(x => x.clave));
        out[i] = lista;
    });
    return out;
}

function insightsBase(ps, durDef) {
    const R = [];
    const n = ps.length;
    if (!n) return R;
    const cur = ps[n - 1];
    const add = (clave, ic, txt, peso, patron) => R.push({ clave, ic, txt, peso, patron: !!patron });
    const dur = p => p.duracion || durDef;
    const jDe = (p, nom) => (p.jugadores || []).find(j => j.nombre === nom) || null;
    const jugo = (p, nom, minMin) => { const j = jDe(p, nom); return j && (j.minutos || 0) > (minMin || 0) ? j : null; };
    const pct = (a, b) => Math.round(a / b * 100);
    const plural = (k, s, pl) => `${k} ${k === 1 ? s : pl}`;
    const res = p => (p.golesH || 0) > (p.golesR || 0) ? 'V' : (p.golesH || 0) < (p.golesR || 0) ? 'D' : 'E';
    const enCur = (cur.jugadores || []).filter(j => (j.minutos || 0) > 0);

    /* 1. Tramos del partido (patrones) */
    if (n >= 3) {
        const conMin = ps.filter(p => Array.isArray(p.golesMin) && p.golesMin.length);
        const C = [], F = [];
        conMin.forEach(p => p.golesMin.forEach(g => (g.t === 'C' ? C : F).push({ min: g.min, dur: dur(p) })));
        if (C.length >= 5) {
            const fin = C.filter(g => g.min > g.dur - 10).length, ini = C.filter(g => g.min <= 10).length;
            if (fin / C.length >= 0.4) add('tramoFinC', '⏱', `El ${pct(fin, C.length)}% de los goles encajados llega en los últimos 10 minutos (${fin} de ${C.length}).`, 45 + (fin / C.length - 0.4) * 100, true);
            if (ini / C.length >= 0.35) add('tramoIniC', '⏱', `El ${pct(ini, C.length)}% de los goles encajados llega en los primeros 10 minutos (${ini} de ${C.length}).`, 42 + (ini / C.length - 0.35) * 100, true);
        }
        if (F.length >= 6) {
            const seg = F.filter(g => g.min > g.dur / 2).length, r = seg / F.length;
            if (r >= 0.65) add('mitadF', '⚽', `El ${pct(seg, F.length)}% de nuestros goles llega en la 2ª parte.`, 35 + (r - 0.65) * 80, true);
            else if (r <= 0.35) add('mitadF', '⚽', `El ${pct(F.length - seg, F.length)}% de nuestros goles llega en la 1ª parte.`, 35 + (0.35 - r) * 80, true);
        }
    }

    /* 2. Rachas y sequías individuales (hechos del último partido) */
    enCur.forEach(j => {
        const nom = j.nombre;
        // partidos jugados por él, del más reciente hacia atrás
        const suyos = [];
        for (let k = n - 1; k >= 0; k--) { const x = jugo(ps[k], nom); if (x) suyos.push(x); }
        if ((j.goles || 0) > 0) {
            let r = 0; for (const x of suyos) { if ((x.goles || 0) > 0) r++; else break; }
            if (r >= 3) add('marca-' + nom, '🔥', `${nom} ha marcado en ${r} partidos seguidos.`, 60 + (r - 3) * 8);
        }
        if ((j.minutos || 0) >= 15) {
            const largos = suyos.filter(x => (x.minutos || 0) >= 15);
            let r = 0; for (const x of largos) { if (!(x.tiros || 0) && !(x.goles || 0)) r++; else break; }
            const antes = largos.slice(r).reduce((s, x) => s + (x.tiros || 0) + (x.goles || 0), 0);
            if (r >= 3 && antes >= 3) add('sinTiro-' + nom, '🎯', `${nom} lleva ${r} partidos sin tirar a puerta (antes sumaba ${antes} tiros y goles).`, 48 + (r - 3) * 6);
            else {
                const golesTemp = suyos.reduce((s, x) => s + (x.goles || 0), 0);
                let g = 0; for (const x of suyos) { if (!(x.goles || 0)) g++; else break; }
                if (g >= 3 && golesTemp >= 3) add('sinGol-' + nom, '🥶', `${nom} lleva ${g} partidos sin marcar (tiene ${plural(golesTemp, 'gol', 'goles')} en la temporada).`, 44 + (g - 3) * 6);
            }
        }
    });

    /* 3. Hitos y liderato de goleadores */
    {
        const acum = (hasta, campo) => { const t = {}; ps.slice(0, hasta).forEach(p => (p.jugadores || []).forEach(j => { t[j.nombre] = (t[j.nombre] || 0) + (j[campo] || 0); })); return t; };
        const gAntes = acum(n - 1, 'goles'), gAhora = acum(n, 'goles');
        const aAntes = acum(n - 1, 'asistencias'), aAhora = acum(n, 'asistencias');
        const HITOS = [5, 10, 15, 20, 25, 30, 40, 50];
        enCur.forEach(j => {
            const h = HITOS.filter(x => (gAntes[j.nombre] || 0) < x && (gAhora[j.nombre] || 0) >= x).pop();
            if (h) add('hitoG-' + j.nombre, '🎉', `${j.nombre} llega a ${h} goles en la temporada.`, 55 + h / 2);
            const ha = HITOS.filter(x => (aAntes[j.nombre] || 0) < x && (aAhora[j.nombre] || 0) >= x).pop();
            if (ha) add('hitoA-' + j.nombre, '👟', `${j.nombre} llega a ${ha} asistencias en la temporada.`, 46 + ha / 2);
        });
        const lider = t => { const o = Object.entries(t).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]); return o.length && (o.length === 1 || o[0][1] > o[1][1]) ? o[0] : null; };
        const lA = lider(gAntes), lN = lider(gAhora);
        if (lN && (!lA || lA[0] !== lN[0]) && n > 1) add('liderG', '👑', `${lN[0]} se pone líder de goleadores con ${lN[1]} goles.`, 58);
        else if (lN) {
            const o = Object.entries(gAhora).sort((a, b) => b[1] - a[1]);
            if (o[1] && lN[1] - o[1][1] === 1 && o[1][1] >= 3) add('persigue', '👀', `${o[1][0]} se queda a 1 gol del máximo goleador (${lN[0]}, ${lN[1]}).`, 34, true);
        }
    }

    /* 4. Con / sin un jugador en el campo (patrón) */
    {
        const psPM = ps.filter(p => (p.jugadores || []).some(j => j.golesContraPista !== undefined || j.golesFavorPista !== undefined));
        if (psPM.length >= 4) {
            const minEq = psPM.reduce((s, p) => s + dur(p), 0);
            const GF = psPM.reduce((s, p) => s + (p.golesH || 0), 0), GC = psPM.reduce((s, p) => s + (p.golesR || 0), 0);
            const st = {};
            psPM.forEach(p => (p.jugadores || []).forEach(j => {
                const s = st[j.nombre] || (st[j.nombre] = { min: 0, gf: 0, gc: 0 });
                s.min += j.minutos || 0; s.gf += j.golesFavorPista || 0; s.gc += j.golesContraPista || 0;
            }));
            let bDef = null, bOf = null;
            Object.entries(st).forEach(([nom, s]) => {
                const minSin = minEq - s.min;
                if (s.min < 50 || minSin < 50) return;
                const gcSin = GC - s.gc, gfSin = GF - s.gf;
                const rC = s.gc / s.min, rS = gcSin / minSin;
                if (gcSin >= 3 && rS >= 1.8 * rC) { const sc = rS / (rC + 0.004); if (!bDef || sc > bDef.sc) bDef = { nom, sc, s, minSin, gcSin }; }
                const fC = s.gf / s.min, fS = gfSin / minSin;
                if (s.gf >= 3 && fC >= 1.6 * fS) { const sc = fC / (fS + 0.004); if (!bOf || sc > bOf.sc) bOf = { nom, sc, s, minSin, gfSin }; }
            });
            const cada = (m, g) => `1 gol cada ${Math.round(m / g)}'`;
            if (bDef) {
                const t = bDef.s.gc === 0
                    ? `Con ${bDef.nom} en el campo no se ha encajado ningún gol en ${bDef.s.min}'; sin él, ${cada(bDef.minSin, bDef.gcSin)}.`
                    : `Con ${bDef.nom} en el campo encajáis ${cada(bDef.s.min, bDef.s.gc)}; sin él, ${cada(bDef.minSin, bDef.gcSin)}.`;
                add('conDef-' + bDef.nom, '🛡️', t, 52 + Math.min(30, bDef.sc * 3), true);
            }
            if (bOf) {
                const t = bOf.gfSin === 0
                    ? `Con ${bOf.nom} en el campo marcáis ${cada(bOf.s.min, bOf.s.gf)}; sin él, ninguno en ${bOf.minSin}'.`
                    : `Con ${bOf.nom} en el campo marcáis ${cada(bOf.s.min, bOf.s.gf)}; sin él, ${cada(bOf.minSin, bOf.gfSin)}.`;
                add('conOf-' + bOf.nom, '⚡', t, 50 + Math.min(30, bOf.sc * 3), true);
            }
        }
    }

    /* 5. Según el nivel del rival (patrón) */
    {
        const SUP = ['muy-superior', 'superior'];
        const sup = ps.filter(p => SUP.includes(p.nivelRival)), resto = ps.filter(p => p.nivelRival && !SUP.includes(p.nivelRival));
        if (sup.length >= 2 && resto.length >= 2) {
            const m = a => a.reduce((s, p) => s + (p.golesH || 0), 0) / a.length;
            const gs = m(sup), gr = m(resto);
            const f = v => String(Math.round(v * 10) / 10).replace('.', ',');
            if (gr > 0 && gs / gr <= 0.6) add('nivelRival', '🎯', `Contra rivales superiores marcáis ${f(gs)} goles por partido, frente a ${f(gr)} contra el resto.`, 40 + (0.6 - gs / gr) * 40, true);
        }
    }

    /* 6. Tendencia de pérdidas del equipo (patrón) */
    {
        const conDatos = ps.filter(p => (p.jugadores || []).some(j => (j.perdidas || 0) + (j.recuperaciones || 0) > 0));
        if (conDatos.length >= 6 && conDatos[conDatos.length - 1] === cur) {
            const per = p => (p.jugadores || []).reduce((s, j) => s + (j.perdidas || 0), 0);
            const ult = conDatos.slice(-3), ant = conDatos.slice(0, -3);
            const mU = ult.reduce((s, p) => s + per(p), 0) / 3, mA = ant.reduce((s, p) => s + per(p), 0) / ant.length;
            if (mA >= 3) {
                const d = (mU - mA) / mA;
                if (d >= 0.3) add('tendPer', '📉', `Últimos 3 partidos: +${Math.round(d * 100)}% de pérdidas respecto a la media anterior.`, 45 + Math.min(20, d * 20), true);
                else if (d <= -0.3) add('tendPer', '📈', `Últimos 3 partidos: ${Math.round(-d * 100)}% menos pérdidas que antes. El equipo cuida más el balón.`, 42 + Math.min(20, -d * 20), true);
            }
        }
    }

    /* 7. Rachas del equipo (hechos) */
    {
        const racha = ok => { let r = 0; for (let k = n - 1; k >= 0; k--) { if (ok(ps[k])) r++; else break; } return r; };
        const v = racha(p => res(p) === 'V'), inv = racha(p => res(p) !== 'D'), d = racha(p => res(p) === 'D'), sg = racha(p => res(p) !== 'V');
        if (v >= 3) add('rachaEq', '🔥', `${v} victorias seguidas.`, 50 + (v - 3) * 5);
        else if (inv >= 4) add('rachaEq', '🛡️', `${inv} partidos seguidos sin perder.`, 46 + (inv - 4) * 4);
        else if (d >= 3) add('rachaEq', '🩹', `${d} derrotas seguidas.`, 45 + (d - 3) * 4);
        else if (sg >= 4) add('rachaEq', '🥶', `${sg} partidos seguidos sin ganar.`, 43 + (sg - 4) * 4);
    }

    /* 8. MVP repetido (hecho) */
    {
        const mvp = p => ((p.jugadores || []).filter(j => (j.minutos || 0) > 0).slice().sort((a, b) => (b.impacto || 0) - (a.impacto || 0) || (b.goles || 0) - (a.goles || 0) || (b.asistencias || 0) - (a.asistencias || 0))[0] || {}).nombre;
        const m = mvp(cur);
        if (m) {
            let r = 0; for (let k = n - 1; k >= 0; k--) { if (mvp(ps[k]) === m) r++; else break; }
            if (r >= 2) add('mvpRep', '⭐', `${m}, MVP ${r} partidos seguidos.`, 52 + (r - 2) * 6);
        }
    }

    return R;
}

let _insCache = { clave: null, datos: {} };
function insightsDe(idx) {
  const clave = (META && META.actualizado) || 0;
  if (_insCache.clave !== clave) { _insCache = { clave, datos: calcularInsightsTodos(D.partidos, DUR_DEF) }; }
  return _insCache.datos[idx] || [];
}
const htmlInsights = (lista, max) => !lista.length ? '' : lista.slice(0, max || 4).map(x => `<div style="display:flex; gap:9px; align-items:flex-start; font-size:12.5px; line-height:1.45; padding:5px 0; color:var(--texto);"><span style="flex-shrink:0;">${x.ic}</span><span>${esc(x.txt)}</span></div>`).join('');

/* ── RÉCORDS DE LA TEMPORADA (mismo cálculo en app y visor) ──
   ps: partidos de liga en orden de juego. Cada récord guarda en qué partido (idx) se consiguió;
   en caso de empate se queda el primero que lo logró. */
function calcularRecords(ps, durDef) {
    durDef = durDef || 50;
    const out = [];
    const resu = p => (p.golesH || 0) > (p.golesR || 0) ? 'V' : (p.golesH || 0) < (p.golesR || 0) ? 'D' : 'E';
    const vs = p => `vs ${p.rival || 'Rival'} ${p.golesH || 0}-${p.golesR || 0}`;
    const add = r => out.push(r);

    /* --- Equipo: un partido --- */
    const mejorPartido = (f, cond) => {
        let best = null, bi = -1;
        ps.forEach((p, i) => { const v = f(p); if (cond(v, p) && (best === null || v > best)) { best = v; bi = i; } });
        return bi < 0 ? null : { v: best, i: bi };
    };
    let m = mejorPartido(p => (p.golesH || 0) - (p.golesR || 0), v => v > 0);
    if (m) add({ id: 'victoria', grupo: 'equipo', ic: '💥', t: 'Mayor victoria', valor: `${ps[m.i].golesH}-${ps[m.i].golesR}`, det: `vs ${ps[m.i].rival} · ${ps[m.i].fecha || ''}`, idx: m.i });
    m = mejorPartido(p => (p.golesR || 0) - (p.golesH || 0), v => v > 0);
    if (m) add({ id: 'derrota', grupo: 'equipo', ic: '🩹', t: 'Peor derrota', valor: `${ps[m.i].golesH}-${ps[m.i].golesR}`, det: `vs ${ps[m.i].rival} · ${ps[m.i].fecha || ''}`, idx: m.i, malo: true });
    m = mejorPartido(p => (p.golesH || 0) + (p.golesR || 0), v => v > 0);
    if (m) add({ id: 'masgoles', grupo: 'equipo', ic: '🎆', t: 'Partido con más goles', valor: `${m.v} goles`, det: `${vs(ps[m.i])} · ${ps[m.i].fecha || ''}`, idx: m.i });

    /* --- Equipo: rachas --- */
    const racha = (ok, id, ic, t, malo) => {
        let cur = 0, ini = 0, best = 0, bIni = -1, bFin = -1;
        ps.forEach((p, i) => {
            if (ok(p)) { if (!cur) ini = i; cur++; if (cur > best) { best = cur; bIni = ini; bFin = i; } }
            else cur = 0;
        });
        if (best < 2) return;
        const actual = cur ? ` · ahora: ${cur}` : '';
        add({ id, grupo: 'equipo', ic, t, valor: `${best} partidos`, det: `de ${ps[bIni].rival} a ${ps[bFin].rival}${actual}`, idx: bFin, malo, enCurso: cur === best && bFin === ps.length - 1 });
    };
    racha(p => resu(p) === 'V', 'rachaV', '🔥', 'Más victorias seguidas');
    racha(p => resu(p) !== 'D', 'rachaInv', '🛡️', 'Más partidos sin perder');
    racha(p => (p.golesR || 0) === 0, 'rachaCero', '🧤', 'Porterías a cero seguidas');
    racha(p => resu(p) !== 'V', 'rachaSinG', '🥶', 'Más partidos sin ganar', true);

    // Minutos sin encajar (misma regla que las rachas de portería)
    {
        let actual = 0, max = 0, maxIdx = -1;
        ps.forEach((p, i) => {
            const dur = p.duracion || durDef;
            const cs = (Array.isArray(p.golesMin) ? p.golesMin : []).filter(g => g.t === 'C').map(g => Math.min(dur, Math.max(0, g.min))).sort((a, b) => a - b);
            if ((p.golesR || 0) > 0 && !cs.length) { actual = 0; return; }
            let prev = 0;
            cs.forEach(mn => { if (actual + mn - prev > max) { max = actual + mn - prev; maxIdx = i; } actual = 0; prev = mn; });
            actual += dur - prev;
            if (actual > max) { max = actual; maxIdx = i; }
        });
        if (max > 0) add({ id: 'sinEncajar', grupo: 'equipo', ic: '🔒', t: 'Más minutos sin encajar', valor: `${max}'`, det: `hasta ${vs(ps[maxIdx])}${actual === max ? ' · sigue en marcha' : ''}`, idx: maxIdx });
    }

    // Remontada: mayor desventaja durante el partido que acabó en victoria
    {
        let best = 0, bi = -1;
        ps.forEach((p, i) => {
            if (resu(p) !== 'V' || !Array.isArray(p.golesMin)) return;
            if (p.golesMin.length !== (p.golesH || 0) + (p.golesR || 0)) return; // hace falta el minuto de todos los goles
            let dif = 0, peor = 0;
            p.golesMin.slice().sort((a, b) => a.min - b.min).forEach(g => { dif += g.t === 'F' ? 1 : -1; peor = Math.min(peor, dif); });
            if (-peor > best) { best = -peor; bi = i; }
        });
        if (bi >= 0) add({ id: 'remontada', grupo: 'equipo', ic: '🔄', t: 'Mayor remontada', valor: `${best} ${best === 1 ? 'gol' : 'goles'}`, det: `perdíamos de ${best} y ganamos ${vs(ps[bi])}`, idx: bi });
    }

    // Gol más rápido y más tardío
    {
        let rap = null, rI = -1, tar = null, tI = -1;
        ps.forEach((p, i) => (Array.isArray(p.golesMin) ? p.golesMin : []).filter(g => g.t === 'F').forEach(g => {
            if (rap === null || g.min < rap) { rap = g.min; rI = i; }
            if (tar === null || g.min > tar) { tar = g.min; tI = i; }
        }));
        if (rI >= 0) add({ id: 'golRapido', grupo: 'equipo', ic: '⚡', t: 'Gol más rápido', valor: `${rap}'`, det: `${vs(ps[rI])} · ${ps[rI].fecha || ''}`, idx: rI });
        if (tI >= 0 && tar !== rap) add({ id: 'golTardio', grupo: 'equipo', ic: '⏰', t: 'Gol más tardío', valor: `${tar}'`, det: `${vs(ps[tI])} · ${ps[tI].fecha || ''}`, idx: tI });
    }

    /* --- Individual: en un solo partido --- */
    const mejorJug = (id, ic, t, f, fmt, extra) => {
        let best = null, bi = -1, bj = null;
        ps.forEach((p, i) => (p.jugadores || []).forEach(j => {
            if ((j.minutos || 0) <= 0) return;
            const v = f(j);
            if (v > 0 && (best === null || v > best)) { best = v; bi = i; bj = j; }
        }));
        if (bi < 0) return;
        add({ id, grupo: 'partido', ic, t, quien: bj.nombre, valor: fmt(best), det: `${vs(ps[bi])} · ${ps[bi].fecha || ''}`, idx: bi, extra: extra ? extra(best) : '' });
    };
    const r1 = v => String(Math.round(v * 10) / 10).replace('.', ',');
    mejorJug('jGoles', '⚽', 'Más goles', j => j.goles || 0, v => v, v => v >= 3 ? (v >= 4 ? 'póker' : 'hat-trick') : '');
    mejorJug('jAsist', '👟', 'Más asistencias', j => j.asistencias || 0, v => v);
    mejorJug('jGA', '🎯', 'Más goles + asistencias', j => (j.goles || 0) + (j.asistencias || 0), v => v);
    mejorJug('jImpacto', '⭐', 'Mejor impacto', j => j.impacto || 0, v => '+' + r1(v));
    mejorJug('jRecup', '✅', 'Más recuperaciones', j => j.recuperaciones || 0, v => v);
    mejorJug('jBalance', '🔄', 'Mejor balance de balón', j => (j.recuperaciones || 0) - (j.perdidas || 0), v => '+' + v);
    mejorJug('jParadas', '🧤', 'Más paradas', j => j.paradas || 0, v => v);

    /* --- Individual: rachas de temporada (contando solo los partidos que juega) --- */
    const rachaJug = (id, ic, t, ok) => {
        const est = {};
        let best = 0, bNom = null, bIni = -1, bFin = -1;
        ps.forEach((p, i) => (p.jugadores || []).forEach(j => {
            if ((j.minutos || 0) <= 0) return;
            const s = est[j.nombre] || (est[j.nombre] = { cur: 0, ini: -1 });
            if (ok(j)) { if (!s.cur) s.ini = i; s.cur++; if (s.cur > best) { best = s.cur; bNom = j.nombre; bIni = s.ini; bFin = i; } }
            else s.cur = 0;
        }));
        if (best < 2) return;
        const sigue = est[bNom] && est[bNom].cur === best;
        add({ id, grupo: 'temporada', ic, t, quien: bNom, valor: `${best} partidos`, det: `de ${ps[bIni].rival} a ${ps[bFin].rival}${sigue ? ' · sigue en marcha' : ''}`, idx: bFin });
    };
    rachaJug('rMarcando', '🔥', 'Más partidos seguidos marcando', j => (j.goles || 0) > 0);
    rachaJug('rImpacto', '📈', 'Más partidos seguidos con impacto positivo', j => (j.impacto || 0) > 0);

    // Hat-tricks de la temporada
    const hats = [];
    ps.forEach((p, i) => (p.jugadores || []).forEach(j => { if ((j.goles || 0) >= 3) hats.push({ nombre: j.nombre, goles: j.goles, p, i }); }));

    // Último récord batido: el conseguido en el partido más reciente (los "malos" no cuentan)
    const buenos = out.filter(r => !r.malo);
    const ultimo = buenos.length ? buenos.reduce((a, b) => b.idx > a.idx ? b : a) : null;
    return { lista: out, ultimo, hats, total: ps.length };
}
