/* ── LIGA: CLASIFICACIÓN Y SIMULADOR (mismo cálculo en app y visor) ──
   Liga a una vuelta: los partidos que faltan son los cruces que aún no tienen resultado.
   Desempate: puntos → enfrentamiento directo entre empatados (puntos y goles) →
   diferencia de goles general → goles a favor. */
const LIGA_DEF = {
    nombre: 'F7 · 4ª División Apertura · Grupo II',
    equipos: ['BODY KING', 'CDV', 'NEWCAMEL FC', 'DAVID GARRIDO EVENTOS', 'SPORTING 593', 'J. DE MUNICH',
        'REVENTAOS CF', 'EL RINCÓN DE LA VENTA FC', 'APOLO II', 'RACING LAS VEGAS', 'ORFEO FC'],
    nuestro: 'BODY KING',
    descienden: 5,
    resultados: [
        { j: 1, l: 'DAVID GARRIDO EVENTOS', v: 'REVENTAOS CF', gl: 5, gv: 4 },
        { j: 1, l: 'CDV', v: 'RACING LAS VEGAS', gl: 6, gv: 2 },
        { j: 1, l: 'APOLO II', v: 'NEWCAMEL FC', gl: 3, gv: 6 },
        { j: 1, l: 'BODY KING', v: 'ORFEO FC', gl: 8, gv: 1 },
        { j: 1, l: 'EL RINCÓN DE LA VENTA FC', v: 'SPORTING 593', gl: 1, gv: 2 }
    ]
};

function ligaNormNombre(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
        .replace(/\b(fc|cf|cd|ud|club|c\.f\.|f\.c\.)\b/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
}
// Busca el equipo de la liga que corresponde a un nombre escrito a mano ("Orfeo" → "ORFEO FC")
function ligaBuscarEquipo(L, nombre) {
    const n = ligaNormNombre(nombre);
    if (!n) return null;
    const exactos = L.equipos.filter(e => ligaNormNombre(e) === n);
    if (exactos.length === 1) return exactos[0];
    const parecidos = L.equipos.filter(e => { const x = ligaNormNombre(e); return x.length >= 3 && n.length >= 3 && (x.includes(n) || n.includes(x)); });
    return parecidos.length === 1 ? parecidos[0] : null;
}
const ligaClavePar = (a, b) => [a, b].sort().join('\u0001');
const ligaPtsDe = (gf, gc) => gf > gc ? 3 : gf === gc ? 1 : 0;
const ligaZonaDescenso = (L, pos) => pos > L.equipos.length - (L.descienden || 0);

function ligaOrdenar(filas, res) {
    filas.sort((a, b) => b.pts - a.pts);
    const out = [];
    for (let i = 0; i < filas.length;) {
        let k = i; while (k < filas.length && filas[k].pts === filas[i].pts) k++;
        const grupo = filas.slice(i, k);
        if (grupo.length > 1) {
            const set = new Set(grupo.map(x => x.eq)), mini = {};
            grupo.forEach(x => { mini[x.eq] = { pts: 0, dg: 0 }; });
            res.forEach(r => {
                if (!set.has(r.l) || !set.has(r.v)) return;
                mini[r.l].pts += ligaPtsDe(r.gl, r.gv); mini[r.v].pts += ligaPtsDe(r.gv, r.gl);
                mini[r.l].dg += r.gl - r.gv; mini[r.v].dg += r.gv - r.gl;
            });
            grupo.sort((a, b) => mini[b.eq].pts - mini[a.eq].pts || mini[b.eq].dg - mini[a.eq].dg
                || (b.gf - b.gc) - (a.gf - a.gc) || b.gf - a.gf || a.eq.localeCompare(b.eq));
        }
        out.push(...grupo); i = k;
    }
    return out;
}

function ligaClasificacion(L, hastaJ) {
    const t = {};
    L.equipos.forEach(e => { t[e] = { eq: e, pj: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, pts: 0 }; });
    const res = (L.resultados || []).filter(r => t[r.l] && t[r.v] && r.l !== r.v && (!hastaJ || r.j <= hastaJ));
    res.forEach(r => {
        const a = t[r.l], b = t[r.v];
        a.pj++; b.pj++; a.gf += r.gl; a.gc += r.gv; b.gf += r.gv; b.gc += r.gl;
        if (r.gl > r.gv) { a.g++; b.p++; a.pts += 3; } else if (r.gl < r.gv) { b.g++; a.p++; b.pts += 3; } else { a.e++; b.e++; a.pts++; b.pts++; }
    });
    return ligaOrdenar(Object.values(t), res).map((x, i) => ({ ...x, pos: i + 1, dg: x.gf - x.gc }));
}

function ligaPendientes(L) {
    const jugados = new Set((L.resultados || []).map(r => ligaClavePar(r.l, r.v)));
    const out = [];
    for (let i = 0; i < L.equipos.length; i++) for (let k = i + 1; k < L.equipos.length; k++) {
        const a = L.equipos[i], b = L.equipos[k];
        if (!jugados.has(ligaClavePar(a, b))) out.push({ l: a, v: b });
    }
    return out;
}

function ligaJornadaActual(L) {
    const porJ = {};
    (L.resultados || []).forEach(r => { porJ[r.j] = (porJ[r.j] || 0) + 1; });
    const js = Object.keys(porJ).map(Number);
    return js.length ? Math.max(...js) : 0;
}

// Simulación de lo que falta: cada equipo tiene una fuerza de ataque y de defensa según
// sus goles (con un poco de "media de la liga" para que 1 partido no lo decida todo).
// La semilla sale de los datos: app y visor muestran exactamente los mismos porcentajes.
function ligaSimular(L, N) {
    N = N || 5000;
    const eqs = L.equipos, n = eqs.length;
    const res = (L.resultados || []).filter(r => eqs.includes(r.l) && eqs.includes(r.v));
    const pend = ligaPendientes(L);
    const base = {}; eqs.forEach(e => { base[e] = { pj: 0, gf: 0, gc: 0 }; });
    res.forEach(r => { base[r.l].pj++; base[r.v].pj++; base[r.l].gf += r.gl; base[r.l].gc += r.gv; base[r.v].gf += r.gv; base[r.v].gc += r.gl; });
    const totP = res.length;
    const mu = totP ? res.reduce((s, r) => s + r.gl + r.gv, 0) / (2 * totP) : 3;
    const K = 4; // peso de la media de la liga: al principio manda más, luego pesan los resultados
    const att = {}, def = {};
    eqs.forEach(e => { const b = base[e]; att[e] = (b.gf + K * mu) / (b.pj + K) / mu; def[e] = (b.gc + K * mu) / (b.pj + K) / mu; });
    let h = 2166136261; const txt = JSON.stringify([eqs, res, N]);
    for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
    let s = h >>> 0;
    const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    // Poisson por tabla acumulada: un solo aleatorio por marcador
    const tablaPoisson = lam => { const c = []; let p = Math.exp(-lam), acc = p; c.push(acc); for (let k = 1; k < 25; k++) { p *= lam / k; acc += p; c.push(acc); } return c; };
    const poisson = c => { const u = rnd(); let k = 0; while (k < c.length - 1 && u > c[k]) k++; return k; };

    // Versión rápida con índices (mismo criterio de desempate que ligaOrdenar)
    const idx = {}; eqs.forEach((e, i) => { idx[e] = i; });
    const nomOrden = eqs.map((e, i) => i).sort((a, b) => eqs[a].localeCompare(eqs[b]));
    const rango = new Array(n); nomOrden.forEach((i, r) => { rango[i] = r; });
    const R0 = res.map(r => [idx[r.l], idx[r.v], r.gl, r.gv]);
    const P = pend.map(m => [idx[m.l], idx[m.v], tablaPoisson(mu * att[m.l] * def[m.v]), tablaPoisson(mu * att[m.v] * def[m.l])]);
    const total = R0.length + P.length;
    const RL = new Int32Array(total), RV = new Int32Array(total), GL = new Int32Array(total), GV = new Int32Array(total);
    R0.forEach((r, k) => { RL[k] = r[0]; RV[k] = r[1]; GL[k] = r[2]; GV[k] = r[3]; });
    P.forEach((m, k) => { RL[R0.length + k] = m[0]; RV[R0.length + k] = m[1]; });
    const pts = new Int32Array(n), gf = new Int32Array(n), gc = new Int32Array(n);
    const mPts = new Int32Array(n), mDg = new Int32Array(n), enGrupo = new Uint8Array(n);
    const orden = new Array(n);
    const cmpBase = (a, b) => pts[b] - pts[a];
    const cmpDesempate = (a, b) => mPts[b] - mPts[a] || mDg[b] - mDg[a] || (gf[b] - gc[b]) - (gf[a] - gc[a]) || gf[b] - gf[a] || rango[a] - rango[b];

    const cuenta = {}; eqs.forEach(e => { cuenta[e] = new Array(n).fill(0); });
    const nuestro = L.nuestro, iN = idx[nuestro] === undefined ? -1 : idx[nuestro];
    const nuestros = [];
    P.forEach((m, k) => { if (m[0] === iN || m[1] === iN) nuestros.push(k); });
    const clave = nuestros.map(() => ({ V: [0, 0, 0], E: [0, 0, 0], D: [0, 0, 0] })); // [veces, salvado, 1º]
    const limiteSalva = n - (L.descienden || 0);
    for (let it = 0; it < N; it++) {
        for (let k = 0; k < P.length; k++) { GL[R0.length + k] = poisson(P[k][2]); GV[R0.length + k] = poisson(P[k][3]); }
        pts.fill(0); gf.fill(0); gc.fill(0);
        for (let k = 0; k < total; k++) {
            const l = RL[k], v = RV[k], a = GL[k], b = GV[k];
            gf[l] += a; gc[l] += b; gf[v] += b; gc[v] += a;
            if (a > b) pts[l] += 3; else if (a < b) pts[v] += 3; else { pts[l]++; pts[v]++; }
        }
        for (let i = 0; i < n; i++) orden[i] = i;
        orden.sort(cmpBase);
        for (let i = 0; i < n;) {
            let k = i; while (k < n && pts[orden[k]] === pts[orden[i]]) k++;
            if (k - i > 1) {
                for (let q = i; q < k; q++) { enGrupo[orden[q]] = 1; mPts[orden[q]] = 0; mDg[orden[q]] = 0; }
                for (let q = 0; q < total; q++) {
                    const l = RL[q], v = RV[q];
                    if (!enGrupo[l] || !enGrupo[v]) continue;
                    const a = GL[q], b = GV[q];
                    mDg[l] += a - b; mDg[v] += b - a;
                    if (a > b) mPts[l] += 3; else if (a < b) mPts[v] += 3; else { mPts[l]++; mPts[v]++; }
                }
                const g = orden.slice(i, k).sort(cmpDesempate);
                for (let q = i; q < k; q++) { orden[q] = g[q - i]; enGrupo[orden[q]] = 0; }
            }
            i = k;
        }
        let posN = -1;
        for (let i = 0; i < n; i++) { cuenta[eqs[orden[i]]][i]++; if (orden[i] === iN) posN = i + 1; }
        nuestros.forEach((k, q) => {
            const m = P[k], r = R0.length + k;
            const gN = m[0] === iN ? GL[r] : GV[r], gR = m[0] === iN ? GV[r] : GL[r];
            const c = clave[q][gN > gR ? 'V' : gN === gR ? 'E' : 'D'];
            c[0]++; if (posN > 0 && posN <= limiteSalva) c[1]++; if (posN === 1) c[2]++;
        });
    }
    const probs = {};
    eqs.forEach(e => {
        const c = cuenta[e].map(x => x / N);
        probs[e] = {
            porPuesto: c,
            medio: c.reduce((s, p, i) => s + p * (i + 1), 0),
            campeon: c[0],
            salva: c.slice(0, limiteSalva).reduce((s, p) => s + p, 0),
            desc: c.slice(limiteSalva).reduce((s, p) => s + p, 0)
        };
    });
    // Partido clave: el que más cambia nuestras opciones según ganemos o perdamos
    let partidoClave = null;
    if (nuestro && probs[nuestro]) {
        const pN = probs[nuestro];
        const usarSalva = pN.desc > 0.03 && pN.salva > 0.03;
        const idx = usarSalva ? 1 : 2;
        nuestros.forEach((kP, k) => {
            const m = pend[kP];
            const c = clave[k], f = x => x[0] ? x[idx] / x[0] : null;
            const pv = f(c.V), pd = f(c.D);
            if (pv === null || pd === null) return;
            const dif = pv - pd;
            if (!partidoClave || dif > partidoClave.dif) partidoClave = { rival: m.l === nuestro ? m.v : m.l, dif, siGana: pv, siEmpata: f(c.E), siPierde: pd, metrica: usarSalva ? 'salva' : 'campeon' };
        });
    }
    return { probs, pendientes: pend.length, partidoClave, N, limiteSalva };
}

// Posición de nuestro equipo jornada a jornada
function ligaEvolucion(L) {
    const maxJ = ligaJornadaActual(L), out = [];
    for (let j = 1; j <= maxJ; j++) {
        const c = ligaClasificacion(L, j), f = c.find(x => x.eq === L.nuestro);
        out.push({ j, pos: f ? f.pos : null });
    }
    return out;
}

function dirSegundos() {

function dirEstado() {

// Minutos sin encajar en directo: si aún no nos han marcado, suma lo que venía de partidos anteriores
function rachaDirecto() {
  const minNow = Math.floor(dirSegundos() / 60);
  const cs = (DIR.eventos || []).filter(e => e.tipo === 'GOL_CONTRA').map(e => e.min);
  if (cs.length) return Math.max(0, minNow - Math.max(...cs));
  return (D ? rachasPorteria().actual : 0) + minNow;
}
const reloj = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

function coordsCampo(sis) {
  const lineas = (sis && sis.lineas) || ['DEF', 'DEF', 'MED', 'MED', 'MED', 'DEL'];
  const usadas = ['GK']; lineas.forEach(l => { if (!usadas.includes(l)) usadas.push(l); });
  usadas.sort((a, b) => ORDEN_LINEAS.indexOf(a) - ORDEN_LINEAS.indexOf(b));
  const n = usadas.length, yDe = {};
  usadas.forEach((l, i) => { yDe[l] = 90 - i * (76 / Math.max(1, n - 1)); });
  const out = { 0: { x: 50, y: yDe.GK } }, grupos = {};
  lineas.forEach((l, i) => (grupos[l] = grupos[l] || []).push(i + 1));
  Object.entries(grupos).forEach(([l, idx]) => {
    const xs = idx.length === 1 ? [50] : idx.length === 2 ? [27, 73] : idx.length === 3 ? [16, 50, 84] : idx.map((_, k) => 12 + k * 76 / (idx.length - 1));
    idx.forEach((pos, k) => { out[pos] = { x: xs[k], y: yDe[l] }; });
  });
  return out;
}

function evTexto(e) {
  if (e.tipo === 'GOL_CONTRA') return `Gol de ${esc(DIR.rival || 'el rival')}`;
  if (e.tipo === 'CAMBIO') { const m = /Sale:\s*(.+?)\s*-\s*Entra:\s*(.+?)(?:\s*\((.+)\))?$/.exec(e.txt || ''); if (m) return `Entra <b style="color:var(--verde); width:auto; font-family:inherit;">${esc(m[2])}</b>, sale ${esc(m[1])}`; }
  if (e.tipo === 'SEGUNDA_PARTE') return 'Descanso · empieza la 2ª parte';
  return esc(e.txt || '');
}

function pintarDirecto() {
  const tab = document.getElementById('tabDirecto');
  const el = document.getElementById('p-directo');
  if (!DIR) {
    tab.style.display = 'none';
    if (estado.tab === 'directo') irTab('resumen');
    pintarBandaVivo();
    return;
  }
  tab.style.display = '';
  if (!dirAbiertoAuto) { dirAbiertoAuto = true; if (estado.tab === 'resumen' && !document.querySelector('.modal.abierto')) irTab('directo'); }
  const est = dirEstado(), vivo = DIR.enMarcha && !DIR.finalizado;
  const js = DIR.jugadores || [];
  const coords = coordsCampo(DIR.sistema);
  const enCampo = js.filter(j => j.enCampo && j.pos != null);
  const banquillo = js.filter(j => !j.enCampo);
  const evs = (DIR.eventos || []).slice().reverse();
  const tabla = js.slice().sort((a, b) => (b.enCampo - a.enCampo) || (b.min - a.min));
  const tarjetas = j => (j.am ? '🟨'.repeat(Math.min(j.am, 2)) : '') + (j.ro ? '🟥' : '');

  el.innerHTML = `
    <div class="marcador">
      <div class="marc-est${vivo ? '' : ' gris'}">${vivo ? '<span class="punto"></span> EN DIRECTO · ' : ''}${est}${DIR.jornada ? ' · ' + esc(DIR.jornada) : ''}</div>
      <div class="marc-fila">
        <div class="marc-eq bk" style="text-align:right;">Bodyking</div>
        <div class="marc-g">${DIR.golesH} – ${DIR.golesR}</div>
        <div class="marc-eq" style="text-align:left;">${esc(DIR.rival || 'Rival')}</div>
      </div>
      <div class="marc-reloj" id="dirReloj">${reloj(dirSegundos())}</div>
      <div style="font-size:11px; color:var(--gris); margin-top:6px;">⛳ Córners ${DIR.corners ? DIR.corners.f : 0} – ${DIR.corners ? DIR.corners.c : 0} · 🧤 Sin encajar: <b id="dirRacha" style="color:var(--tiza);">${rachaDirecto()}'</b></div>
    </div>
    <div class="card">
      <div class="card-t"><span>⏱ Lo que va pasando ${info('directo')}</span></div>
      ${evs.length ? evs.map(e => `<div class="ev${e.tipo === 'GOL_CONTRA' ? ' rival' : ''}"><b>${e.min}'</b><span>${evIcono(e)} ${evTexto(e)}</span></div>`).join('')
        : '<div style="font-size:12.5px; color:var(--gris);">Aún no ha pasado nada destacado.</div>'}
    </div>
    <div class="card">
      <div class="card-t"><span>🟩 En el campo</span><span>${esc(DIR.sistema ? DIR.sistema.nombre : '')}</span></div>
      <div class="campo"><div class="lin"></div><div class="circ"></div><div class="area" style="top:0;"></div><div class="area" style="bottom:0;"></div>
        ${enCampo.map(j => { const c = coords[j.pos] || { x: 50, y: 50 };
          const extra = (j.g ? '⚽'.repeat(Math.min(j.g, 3)) : '') + tarjetas(j);
          return `<div class="jf${j.pos === 0 ? ' gk' : ''}" style="left:${c.x}%; top:${100 - c.y}%;"><div class="c">${j.d != null ? esc(j.d) : esc(String(j.n || '?').charAt(0))}</div><div class="n">${esc(j.n)}</div>${extra ? `<div class="x">${extra}</div>` : ''}</div>`; }).join('')}
      </div>
      ${banquillo.length ? `<div style="font-size:11.5px; color:var(--gris); margin-top:10px; line-height:1.6;">🪑 Banquillo: ${banquillo.map(j => esc(j.n) + (j.min ? ` <span style="color:var(--gris2)">(${j.min}')</span>` : '')).join(' · ')}</div>` : ''}
    </div>
    <div class="card" style="padding:10px 8px;">
      <div class="card-t" style="padding:0 4px;"><span>👥 Jugadores en este partido ${info('directo')}</span></div>
      <div class="tabla-wrap"><table class="tb">
        <thead><tr><th>Jugador</th><th>Min</th><th>⚽</th><th>👟</th><th>✅</th><th>❌</th><th>🎯</th><th>🧤</th></tr></thead>
        <tbody>${tabla.map(j => `<tr><td class="n">${j.enCampo ? '' : '<span style="color:var(--gris2)">🪑 </span>'}${esc(j.n)}${tarjetas(j) ? ' ' + tarjetas(j) : ''}</td>
          ${[j.min + "'", j.g, j.a, j.rec, j.per, j.tir, j.par].map((v, k) => `<td class="${(k > 0 && !v) || (k === 0 && !j.min) ? 'cero-v' : ''}">${v}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table></div>
      <div class="nota" style="padding:0 4px;">✅ recuperaciones · ❌ pérdidas · 🎯 tiros · 🧤 paradas. Se actualiza solo.</div>
    </div>`;
  pintarBandaVivo();
}

function pintarBandaVivo() {
  const cont = document.getElementById('bandaVivo');
  if (!cont) return;
  if (!DIR || DIR.finalizado) { cont.innerHTML = ''; return; }
  cont.innerHTML = `<div class="banda-vivo" data-tab-ir="directo"><span class="punto"></span>
    <div class="t">${DIR.enMarcha ? 'En directo' : dirEstado().toLowerCase().replace(/^./, c => c.toUpperCase())} · vs ${esc(DIR.rival || 'Rival')}<div class="sub" style="margin-top:1px;">Toca para seguir el partido</div></div>
    <div class="m">${DIR.golesH} – ${DIR.golesR}</div><span class="flecha">›</span></div>`;
}

function avisoGol() {
  if (!DIR) { golesPrevios = null; return; }
  if (golesPrevios === null || rivalPrevio !== DIR.rival) { golesPrevios = DIR.golesH; rivalPrevio = DIR.rival; return; }
  if (DIR.golesH > golesPrevios && !DIR.finalizado) {
    const g = (DIR.eventos || []).filter(e => e.tipo === 'GOL_FAVOR').pop();
    const quien = g ? (g.txt || '').replace(/^GOL de\s*/, '') : '';
    document.getElementById('golAvisoB').textContent = `Bodyking ${DIR.golesH} – ${DIR.golesR} ${DIR.rival || ''}${quien ? ' · ' + quien : ''}`;
    const b = document.getElementById('golAviso'); b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    clearTimeout(golTimer); golTimer = setTimeout(() => b.classList.remove('on'), 7000);
    try { if (navigator.vibrate && document.visibilityState === 'visible') navigator.vibrate([180, 80, 180]); } catch (e) {}
  }
  golesPrevios = DIR.golesH;
}

function cargarDirecto(obj) {
  if (obj && obj.activo && obj.datos) {
    try { DIR = JSON.parse(obj.datos); DIR_TS = obj.ts || Date.now(); } catch (e) { DIR = null; }
  } else DIR = null;
  avisoGol();
  pintarDirecto();
}
window.__cargarDirecto = cargarDirecto; // para pruebas
setInterval(() => { const r = document.getElementById('dirReloj'); if (r && DIR) r.textContent = reloj(dirSegundos());
  const k = document.getElementById('dirRacha'); if (k && DIR) k.textContent = rachaDirecto() + "'"; }, 1000);
document.getElementById('golAviso').addEventListener('click', e => e.currentTarget.classList.remove('on'));

/* ---------- carga de datos desde Firebase (REST + actualización en directo) ---------- */
function cabecera() {
  const el = document.getElementById('cabEstado');
  if (!META || !META.actualizado) return;
  const f = new Date(META.actualizado);
  el.textContent = `Temporada · actualizado ${f.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })} a las ${f.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}`;
}
function cargarDatos(obj) {
  if (!obj || !obj.datos) {
    document.getElementById('cabEstado').textContent = 'Aún no hay datos publicados';
    document.getElementById('p-resumen').innerHTML = `<div class="card vacio"><span class="ic">📡</span>La temporada todavía no se ha publicado.<br>Se hace desde la app: Ajustes → Visor online → Publicar ahora.</div>`;
    return;
  }
  try { D = JSON.parse(obj.datos); } catch (e) { console.error(e); return; }
  D.partidos = Array.isArray(D.partidos) ? D.partidos : [];
  META = { actualizado: obj.actualizado };
  cabecera(); pintarTodo();
}
window.__cargarDatos = cargarDatos; // para pruebas

/* ---------- Aviso de la guía la primera vez ---------- */
(() => { let visto = false; try { visto = localStorage.getItem('bk_guia_vista') === '1'; } catch (e) {}
  if (!visto) document.getElementById('avisoGuia').innerHTML = `<div class="aviso" style="display:flex; align-items:center; gap:10px; color:var(--texto); background:rgba(0,217,196,.07); border-color:rgba(0,217,196,.3);">
    <span style="flex:1;">👋 ¿Primera vez? Toca <button class="info" data-guia="" style="vertical-align:0;">ⓘ</button> en cualquier apartado para ver cómo se calcula cada número.</span>
    <button class="cerrar" data-cerrar-guia="1" aria-label="Cerrar aviso" style="width:30px; height:30px; font-size:14px;">✕</button></div>`; })();

/* ---------- Tema claro / oscuro (se recuerda en cada móvil) ---------- */
function ponerIconoTema() { document.getElementById('btnTema').textContent = document.documentElement.getAttribute('data-tema') === 'oscuro' ? '☀️' : '🌙'; }
document.getElementById('btnTema').addEventListener('click', () => {
  const nuevo = document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-tema', nuevo);
  try { localStorage.setItem('bk_tema', nuevo); } catch (e) {}
  ponerIconoTema();
});
ponerIconoTema();

/* ---------- PWA: instalable en el móvil ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
let eventoInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); eventoInstalar = e; document.getElementById('btnInstalar').style.display = ''; });
document.getElementById('btnInstalar').addEventListener('click', async () => {
  if (!eventoInstalar) return;
  eventoInstalar.prompt();
  try { await eventoInstalar.userChoice; } catch (e) {}
  eventoInstalar = null; document.getElementById('btnInstalar').style.display = 'none';
});
window.addEventListener('appinstalled', () => { document.getElementById('btnInstalar').style.display = 'none'; });

const dbUrl = (new URLSearchParams(location.search).get('db') || DB_URL).trim().replace(/\/+$/, '');
// Se leen los campos uno a uno: la clave de escritura que guarda la app no es legible
async function leerCampos(ruta, campos) {
  const vals = await Promise.all(campos.map(c => fetch(`${dbUrl}/${ruta}/${c}.json`, { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })));
  const o = {}; campos.forEach((c, i) => { o[c] = vals[i]; }); return o;
}
async function leer() { cargarDatos(await leerCampos(RUTA, ['actualizado', 'datos'])); }
function errorCarga(msg) {
  document.getElementById('cabEstado').textContent = 'Sin conexión con los datos';
  if (!D) document.getElementById('p-resumen').innerHTML = `<div class="card vacio"><span class="ic">⚠️</span>${esc(msg)}</div>`;
}
if (!/^https:\/\//.test(dbUrl)) {
  document.getElementById('avisoConfig').innerHTML = `<div class="aviso">⚙️ Falta configurar el visor: pon la URL de tu base de datos de Firebase en <b>DB_URL</b>, al principio del código de este archivo.</div>`;
  document.getElementById('cabEstado').textContent = 'Sin configurar';
  document.getElementById('p-resumen').innerHTML = '';
} else {
  leer().catch(e => errorCarga('No se ha podido leer la temporada (' + e.message + '). Comprueba la URL y que las reglas de Firebase permitan leer bodyking.'));
  // Firebase manda los cambios al momento por este canal; si se corta, el navegador reconecta solo
  try {
    const es = new EventSource(`${dbUrl}/${RUTA}/actualizado.json`);
    let t = null;
    const recargar = () => { clearTimeout(t); t = setTimeout(() => leer().catch(() => {}), 300); };
    es.addEventListener('put', recargar);
    es.addEventListener('patch', recargar);
  } catch (e) {}
  const leerDirecto = () => leerCampos(RUTA_DIR, ['activo', 'ts', 'datos']).then(cargarDirecto).catch(() => {});
  leerDirecto();
  try {
    const ed = new EventSource(`${dbUrl}/${RUTA_DIR}/ts.json`);
    let td = null;
    const rd = () => { clearTimeout(td); td = setTimeout(leerDirecto, 150); };
    ed.addEventListener('put', rd);
    ed.addEventListener('patch', rd);
  } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { leer().catch(() => {}); leerDirecto(); } });
}
</script>
</body>
</html>
